name: E2E

# Opt-in, never a merge gate: this boots a multi-container regtest stack and
# moves regtest money, so it will go red for reasons no diff owns. Label a PR
# `run-e2e` to exercise it there; dispatch or the nightly cover main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref of this repo to test (blank = the dispatch ref)'
        required: false
        default: ''
      files:
        description: 'vitest filename filter, space separated'
        required: false
        default: ''
      profiles:
        description: 'arkade-regtest profiles to bring up'
        required: false
        default: ''
  pull_request:
    types: [labeled, synchronize, reopened]
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_ENV_FILE: .env.ci-e2e
  E2E_FILES: ${{ inputs.files || 'assetRfqCorridor assetOffer assetLockup' }}
  E2E_PROFILES: ${{ inputs.profiles || 'emulator' }}
  # Pinned, not `master`: this job is a control on THIS repo's corridors, so the
  # stack under them has to hold still. arkade-regtest's own CI watches its drift.
  REGTEST_REF: 6b0a60ca3f7ac48823fce7864034722262f348c7

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # On the host, not in a container: the suite needs the stack's localhost ports.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/checkout@v4
        with:
          repository: ArkLabsHQ/arkade-regtest
          ref: ${{ env.REGTEST_REF }}
          path: arkade-regtest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4

      # Retried for the reason ci.yml's build job gives at length.
      - name: Install
        run: |
          set -eu
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            echo "install attempt ${attempt} failed; retrying"
            sleep 5
          done
          exit 1

      # scripts/regtest-*.mjs import packages/solver-app/dist/config.js.
      - name: Build
        run: pnpm build

      - name: Start the regtest stack
        working-directory: arkade-regtest
        timeout-minutes: 20
        run: node regtest.mjs start --profile "$E2E_PROFILES"

      # Generated HERE, never committed and never a repository secret: a regtest
      # seed is still a credential. No settle after the fund: that script ends
      # settled, and a second races a stale boarding view into a hang (33916796535).
      - name: Provision a fresh Arkade wallet
        timeout-minutes: 10
        run: |
          set -eu
          node --input-type=module -e '
            import { writeFileSync } from "node:fs"
            import { generateMnemonic } from "@scure/bip39"
            import { wordlist } from "@scure/bip39/wordlists/english.js"
            writeFileSync(process.env.E2E_ENV_FILE, [
              "SWAP_NETWORK=regtest",
              "LN_BACKEND=fake",
              `ARK_MNEMONIC="${generateMnemonic(wordlist, 128)}"`,
              "ARK_SERVER_URL=http://localhost:7070",
              "EMULATOR_URL=http://localhost:7073",
              "ESPLORA_URL=http://localhost:3000/api",
              "ARK_DB_PATH=.data/ark-ci.sqlite",
              "SWAP_DB_PATH=.data/swaps-ci.sqlite",
              "",
            ].join("\n"))
          '
          node --experimental-eventsource --env-file="$E2E_ENV_FILE" scripts/regtest-fund.mjs arkade-regtest 0.05

      - name: Mint an asset for the asset corridors
        timeout-minutes: 10
        run: |
          set -eu
          node --experimental-eventsource --env-file="$E2E_ENV_FILE" scripts/regtest-mint-asset.mjs 1000000 ARFQ
          node --experimental-eventsource --env-file="$E2E_ENV_FILE" scripts/regtest-settle.mjs

      # No `--`: pnpm forwards it verbatim, and vitest then ignores every
      # positional after it and runs the whole suite. `verbose` names what ran.
      - name: E2E suite
        run: pnpm test:e2e --reporter=verbose $E2E_FILES

      - name: Dump diagnostics on failure
        if: failure()
        working-directory: arkade-regtest
        run: |
          docker compose -f docker/compose.base.yml -f docker/compose.ark.yml ps || true
          for c in bitcoin bitcoin-miner fulcrum mempool_api mempool_web nbxplorer arkd-wallet arkd emulator; do
            echo "===== logs: $c ====="
            docker logs --tail 80 "$c" 2>&1 || true
          done

      - name: Cleanup
        if: always()
        working-directory: arkade-regtest
        run: node regtest.mjs clean
