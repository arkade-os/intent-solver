\* CONTROL FOR LightningReceive_Overexposed.cfg — THE FIX, NOT THE BUG.
\*
\* Identical to LightningReceive_Overexposed.cfg (MaxExposed = 1, so the cap
\* genuinely binds with two swaps) except AtomicAdmission = TRUE: the exposure
\* check is re-evaluated by the same conditional write that consumes it, e.g.
\*
\*   INSERT INTO receive_swap (...) SELECT ... WHERE
\*     (SELECT COALESCE(SUM(amount_sats),0) FROM receive_swap
\*       WHERE state IN (...)) + ? <= ?
\*
\* EXPECTED RESULT: green.  This is what makes the mutation check a proof that
\* the fix is SUFFICIENT rather than merely plausible — without it, a green
\* Overexposed run could just mean the cap never binds.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions; this was
\* verified on LightningSend (SwapCore trap T4).  Pay the 4x instead.

\* The model deliberately goes quiescent once every swap is terminal and the
\* clock has reached MaxClock; that is the end of the modelled world, not a
\* stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 1
    Phases     <- LRPhases
    Results    <- LRResults
    SpendKinds <- LRSpendKinds

    RefundLocktime     = 3
    InvoiceExpiry      = 2
    MinSettleWindow    = 2
    SettleSafetyMargin = 1
    EmptyLockupGrace   = 1
    EChoices           = {2, 4}
    UnilateralDelay    = 1
    RecourseMargin     = 1

    BreakSettleMargin    = FALSE
    BreakRecourseMargin  = FALSE
    BreakEmptyGrace      = FALSE
    ArkadeHonoursFundKey = TRUE
    FundGateOneShot      = TRUE
    AtomicAdmission      = TRUE
    SettleIsIdempotent   = TRUE
    ServerMayCensor      = FALSE

INVARIANTS
    TypeOK
    NoDoubleFund
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    RecourseBeforeDeadline
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
