\* EVM receive corridor, ARTIFACT: strict terminality - the parked states
\* named.  Identical constants to the green cfg, but the property is
\* LivenessStrict: every swap must reach a TERMINAL state, no parking.
\*
\* EXPECTED RESULT: LivenessStrict violated.  A crash in the fund push
\* (before the sats went out) or after the refund CAS leaves the row in
\* funding_arkade / refunding_arkade forever - the shipped planner never
\* re-drives either (the F1 finding), so only the money invariants bound
\* what the parking costs.  The green cfg's Liveness is the statement that
\* holds.

\* RESULT: fires as expected.  3,115,999 states generated, 427,805 distinct, 2min 58s (-workers 4).

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- ERPhases
    Results    <- ERResults
    SpendKinds <- ERSpendKinds

    EvmTimeoutH       = 3
    ClaimMarginBlocks = 1
    RefundLocktime    = 2
    ValidUntil        = 2
    MaxHeight         = 5
    FastCad           = 1
    SlowCad           = 2

    FundCommitFirst    = TRUE
    ClaimLandsPromptly = TRUE
    ClaimRecordsReceipt = TRUE
    FundLandsPromptly  = TRUE
    RefundSpendAtomic  = TRUE

    RefundRedrivenWhileUnspent = TRUE
    AtomicAdmission    = TRUE
    BreakDeadlineOrder = FALSE

INVARIANTS
    TypeOK
    NoDoubleFund
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    HeightSane

PROPERTIES
    LivenessStrict
