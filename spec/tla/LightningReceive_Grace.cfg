\* MUTATION CHECK — EMPTY_LOCKUP_GRACE REMOVED.
\*
\* One line differs from LightningReceive.cfg: BreakEmptyGrace = TRUE, which
\* deletes the wait from src/receive/orchestrator.ts:531:
\*
\*     if (this.now() - row.updatedAt < EMPTY_LOCKUP_GRACE) return false
\*
\* whenRefunding then judges on a SINGLE observation.  The two Arkade reads do
\* not go true at the same instant: findLockups is getVtxos({spendableOnly:
\* true}) and reports the lockup gone the moment a claim marks the vtxo spent,
\* while findClaimPreimage must still see spentBy/settledBy populated AND fetch
\* the spending virtual transaction back.  In that gap a swap that in fact
\* COMPLETED reads exactly like the inexplicable case.
\*
\* EXPECTED RESULT: Invariant NoNetLoss is violated — a late-but-valid claim
\* lands, the row is escalated to terminal `stuck` before P becomes readable,
\* nothing ever settles the held HTLC, and E passes.  The client has the
\* solver's sats and the solver has nothing.  `stuck` has no outgoing edge, so
\* the swap can never recover once it lands there.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions; this was
\* verified on LightningSend (SwapCore trap T4).  Pay the 4x instead.

\* The model deliberately goes quiescent once every swap is terminal and the
\* clock has reached MaxClock; that is the end of the modelled world, not a
\* stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- LRPhases
    Results    <- LRResults
    SpendKinds <- LRSpendKinds

    RefundLocktime     = 3
    InvoiceExpiry      = 2
    MinSettleWindow    = 2
    SettleSafetyMargin = 1
    EmptyLockupGrace   = 1
    EChoices           = {2, 4}
    UnilateralDelay    = 1
    RecourseMargin     = 1

    BreakSettleMargin    = FALSE
    BreakRecourseMargin  = FALSE
    BreakEmptyGrace      = TRUE
    ArkadeHonoursFundKey = TRUE
    FundGateOneShot      = TRUE
    AtomicAdmission      = TRUE
    SettleIsIdempotent   = TRUE
    ServerMayCensor      = FALSE

INVARIANTS
    TypeOK
    NoDoubleFund
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    RecourseBeforeDeadline
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
