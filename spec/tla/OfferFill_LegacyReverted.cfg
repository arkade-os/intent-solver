\* EXPECTED RESULT: NoDoubleFill violated.
\*
\* OfferFill_Upgrade.cfg with BreakLegacyReverted = TRUE: recovery also walks
\* back a `filling` row that carries no phase. The old version wrote such a row
\* and may already have submitted it, so the next attempt fills it again.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Workers = {w1, w2}
    Legacy = {w2}
    MaxCrashes = 1
    MaxDeferrals = 1
    LegacyRow = TRUE
    Recovery = TRUE
    BreakLatch = FALSE
    BreakRevertGuard = FALSE
    BreakRevertReset = FALSE
    BreakLegacyReverted = TRUE
    LateTyped = FALSE

INVARIANTS
    NoDoubleFill
    LatchedNeverReady
    FilledMeansSent
    TypeOK
