\* Onchain receive corridor — the green model.
\*
\* 2 swaps, 2 workers, wall clock bounded to 0..5, chain-tip clock trailing it
\* by at most MtpLag = 1.
\*
\* Only the RELATIVE ORDERING of the deadlines is modelled, because that
\* ordering is all the guards compare.  Mapping from packages/solver-core/src/core/onchainReceive.ts
\* at minConfirmations = 1, with T0 = quote time and one model tick ~ 2940 s:
\*
\*     client funding deadline   LockupDeadline    1   (T0 +   900)
\*     arkade funding closes     R - W             2   (T0 +  3900)
\*     arkade refund opens    R  RefundLocktime    3   (T0 +  9300)
\*     onchain htlc deadline  E  HtlcLocktime      5   (T0 + 14700)
\*
\*     R = FundingBudget + MinArkFundWindow = 2 + 1
\*     E = R + MinSettleWindow              = 3 + 2
\*
\* MinArkFundWindow and MinSettleWindow are BOTH 5400 s in the code and are
\* deliberately 1 and 2 here: at this bound only one of them can afford the
\* second tick, and it has to be the one `MtpLag < E - R` is measured
\* against.  The scale distorts the ratios and preserves the ordering, which
\* is what the guards read.
\*
\* Consequences, all of them exercised:
\*   - the arkade funding gate is open through clock 1, one tick PAST the
\*     client's own funding deadline.  That is the whole content of #160:
\*     before it the client had 30 minutes to broadcast and confirm in, which
\*     one slow block beat and three confirmations could not fit at all
\*   - the solver arms its unwind at clock 2, a full MIN_ARKADE_FUND_WINDOW
\*     before its own refund path is open at chain time 3
\*   - the covenant refund is rejected (FORFEIT_CLOSURE_LOCKED) until the
\*     chain tip's clock reaches 3, so refunding_arkade is entered and sits
\*     there retrying — the interval the code absorbs by re-ticking, and the
\*     interval in which the client may still claim
\*   - the client's own L1 refund leaf opens at chain time 5, two ticks after
\*     the solver's escape hatch: that gap IS MIN_SETTLE_WINDOW, and it is
\*     the entire budget for the claimed -> settled sweep
\*   - a reorg may evict a funding output that has not reached
\*     min_confirmations, and may not evict one that has — which is the whole
\*     content of this corridor's reorg policy
\*
\* A larger bound (MaxClock 8, three swaps) would add longer stretches of
\* waiting inside refunding_arkade and exposure arithmetic over more than two
\* concurrent admissions.  It would NOT add new interleavings of the
\* read / side-effect / compare-and-swap triple, which is where every finding
\* lives — those are all reachable with two workers on one row inside a single
\* frozen tick.  The binding constraint on the bound is TLC's liveness
\* tableau, not the reachability analysis, and 5 is now the FLOOR rather than
\* a choice: four deadlines with the budget strictly wider than the lockup
\* deadline do not fit in fewer ticks.  Under the pre-#160 constants a bound
\* of 5 completed the safety run while the temporal check did not finish in
\* 15 minutes — budget for a long one, and re-measure every figure in
\* OnchainReceive.tla's report, which is the 0..4 model's.

SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions: it can report a
\* liveness counterexample whose cycle exists only in the quotient graph.
\* Verified on LightningSend with this exact shape of fairness.  Corridor
\* authors: do not "optimise" this back on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 5
    Amount     = 1
    MaxExposed = 2
    Phases     <- ORPhases
    Results    <- ORResults
    SpendKinds <- ORSpendKinds

    FundingBudget      = 2
    MinSettleWindow    = 2
    SettleSafetyMargin = 1
    MinArkFundWindow   = 1
    LockupDeadline     = 1
    MinConfirmations   = 1
    MtpLag             = 1

    BreakDeadlineOrder  = FALSE
    BreakConfirmations  = FALSE
    FundIsIdempotent    = TRUE
    LockupProvablySpent = FALSE
    IndexerNeverLies    = TRUE
    ClaimFeeAffordable  = TRUE
    MempoolExclusive    = TRUE
    SettleNeedsConfirmation = TRUE
    AtomicAdmission     = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    ForwardOnly
    Liveness
