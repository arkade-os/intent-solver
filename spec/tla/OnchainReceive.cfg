\* Onchain receive corridor — the green model.
\*
\* 2 swaps, 2 workers, wall clock bounded to 0..4, chain-tip clock trailing it
\* by at most MtpLag = 1.
\*
\* Only the RELATIVE ORDERING of the deadlines is modelled, because that
\* ordering is all the guards compare.  Mapping from src/core/onchainReceive.ts
\* at minConfirmations = 1, with T0 = quote time and one model tick ~ 2800 s:
\*
\*     client funding deadline   LockupDeadline    1   (T0 +   900)
\*     arkade funding closes     R - W             1   (T0 +  1800)
\*     arkade refund opens    R  RefundLocktime    2   (T0 +  7200)
\*     onchain htlc deadline  E  HtlcLocktime      4   (T0 + 11400)
\*
\*     R = min(E - SettleSafetyMargin, RefundHorizon) = min(4-2, 2) = 2
\*
\* The two bounds COINCIDE at this scale.  In production the horizon binds
\* strictly (7200 < 10500), so the `htlcLocktime - SETTLE_SAFETY_MARGIN` term
\* never selects and the corridor's ordering invariant R + M <= E holds as a
\* SIDE EFFECT of the horizon cap rather than because the margin term does
\* any work.  OnchainReceive_Broken.cfg and its control separate them by
\* raising the horizon, which is exactly the configuration change that
\* re-arms the margin term — and the one the pair proves is load-bearing.
\*
\* Consequences, all of them exercised:
\*   - the arkade funding gate is open only at clock 0, so a client whose
\*     funding does not reach min_confirmations inside one tick is refused
\*     rather than served (the reachability squeeze the code's own arithmetic
\*     produces: 15 min to fund plus C blocks to confirm against a 30 min
\*     window, structurally impossible for C >= 3)
\*   - the solver arms its unwind at clock 1, a full MIN_ARKADE_FUND_WINDOW
\*     before its own refund path is open at chain time 2
\*   - the covenant refund is rejected (FORFEIT_CLOSURE_LOCKED) until the
\*     chain tip's clock reaches 2, so refunding_arkade is entered and sits
\*     there retrying — the interval the code absorbs by re-ticking, and the
\*     interval in which the client may still claim
\*   - the client's own L1 refund leaf opens at chain time 4, two ticks after
\*     the solver's escape hatch: that gap IS SETTLE_SAFETY_MARGIN, and it is
\*     the entire budget for the claimed -> settled sweep
\*   - a reorg may evict a funding output that has not reached
\*     min_confirmations, and may not evict one that has — which is the whole
\*     content of this corridor's reorg policy
\*
\* A larger bound (MaxClock 8, three swaps) would add longer stretches of
\* waiting inside refunding_arkade and exposure arithmetic over more than two
\* concurrent admissions.  It would NOT add new interleavings of the
\* read / side-effect / compare-and-swap triple, which is where every finding
\* lives — those are all reachable with two workers on one row inside a single
\* frozen tick.  The binding constraint on the bound is TLC's liveness
\* tableau, not the reachability analysis: at MaxClock 5 the safety run still
\* completes but the temporal check does not finish in 15 minutes.

SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions: it can report a
\* liveness counterexample whose cycle exists only in the quotient graph.
\* Verified on LightningSend with this exact shape of fairness.  Corridor
\* authors: do not "optimise" this back on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- ORPhases
    Results    <- ORResults
    SpendKinds <- ORSpendKinds

    HtlcLocktime       = 4
    SettleSafetyMargin = 2
    RefundHorizon      = 2
    MinArkFundWindow   = 1
    LockupDeadline     = 1
    MinConfirmations   = 1
    MtpLag             = 1

    BreakDeadlineOrder  = FALSE
    BreakConfirmations  = FALSE
    FundIsIdempotent    = TRUE
    LockupProvablySpent = FALSE
    IndexerNeverLies    = TRUE
    ClaimFeeAffordable  = TRUE
    MempoolExclusive    = TRUE
    AtomicAdmission     = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    ForwardOnly
    Liveness
