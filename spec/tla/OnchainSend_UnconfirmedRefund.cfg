\* MUTATION CHECK — `refunded` RECORDS A BROADCAST AGAIN.
\*
\* Two lines differ from OnchainSend.cfg.
\*
\* RefundNeedsConfirmation = FALSE restores what the corridor shipped before
\* #204: `refunded` written on `broadcastRaw` returning, terminal, and absent
\* from NON_TERMINAL, so findRecoverable() never looks at the row again.
\*
\* MempoolExclusive = FALSE is what makes that reachable, and it is not a
\* hypothesis: src/onchain/refund.ts sets the input sequence to 0xfffffffd,
\* which enables nLockTime AND SIGNALS OPT-IN RBF.  0xfffffffe would enable the
\* locktime without the second half.  So a conflicting spend really can be
\* relayed and confirmed after the solver's refund was broadcast.
\*
\* EXPECTED RESULT: Invariant NoSilentLoss is violated.  The row is terminal
\* `refunded` while the transaction that actually confirmed is the client's
\* claim: the solver's L1 sats are gone, P was revealed on a witness nobody
\* ever read, the Arkade lockup is never claimed, and nothing pages a human.
\*
\* Its control is OnchainSend_MempoolRace.cfg, which holds MempoolExclusive
\* FALSE and turns the guard back on.  Read that cfg's header before treating
\* this pair as "RBF is now safe" — it is not; what the guard removes is the
\* SILENT half.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions (SwapCore trap
\* T4, verified on LightningSend: symmetry on -> bogus liveness
\* counterexample, symmetry off -> no error).  Do not "optimise" this on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 3
    Amount     = 1
    MaxExposed = 2
    Phases     <- OSPhases
    Results    <- OSResults
    SpendKinds <- OSSpendKinds

    HtlcLocktime     = 1
    RefundMtpMargin  = 1
    MtpLag           = 1
    RefundLocktime   = 3
    MinFundWindow    = 2
    LockupDeadline   = 2
    MinConfirmations = 1
    RefundNeedsConfirmation = FALSE

    BreakRefundRecheck = FALSE
    BreakRefundTiming  = FALSE
    MempoolExclusive   = FALSE
    FundIsIdempotent   = TRUE
    LockupReadIsReliable = TRUE
    AtomicAdmission    = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane
