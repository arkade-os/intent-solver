\* MUTATION CHECK — THE PRE-BROADCAST SPEND RE-READ REMOVED.  THE MANDATED ONE.
\*
\* One line differs from OnchainSend.cfg: BreakRefundRecheck = TRUE, which
\* deletes this from whenRefundingOnchain (src/send/onchainOrchestrator.ts
\* :678-704):
\*
\*     const claimWitness = await onchain.findSpendWitness({ ... })
\*     if (claimWitness) {
\*       const preimage = preimageFromClaimWitness(claimWitness)
\*       if (preimage && paymentHashOf(preimage) === row.paymentHash) {
\*         return store.transition(row.id, 'refunding_onchain', 'claiming', ...)
\*       }
\*       ...
\*     }
\*
\* i.e. the solver stops looking before it races a refund, and the back-edge
\* refunding_onchain -> claiming becomes unreachable.
\*
\* EXPECTED RESULT: Invariant NoNetLoss is violated — the client claims the
\* onchain HTLC AND pulls the Arkade lockup back, exactly the outcome the
\* removed code's own comment describes.  The trace is reproduced in the
\* comment block at the end of OnchainSend.tla.
\*
\* Note NoSilentLoss does NOT fire here: the row never reaches a terminal
\* state at all, it retries a doomed double-spend forever.  A spec that only
\* checked terminal states would have missed this.
\*
\* Liveness is not checked here; TLC stops at the invariant violation.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions (SwapCore trap
\* T4, verified on LightningSend: symmetry on -> bogus liveness
\* counterexample, symmetry off -> no error).  Do not "optimise" this on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 3
    Amount     = 1
    MaxExposed = 2
    Phases     <- OSPhases
    Results    <- OSResults
    SpendKinds <- OSSpendKinds

    HtlcLocktime     = 1
    RefundMtpMargin  = 1
    MtpLag           = 1
    RefundLocktime   = 3
    MinFundWindow    = 2
    LockupDeadline   = 2
    MinConfirmations = 1
    RefundNeedsConfirmation = TRUE

    BreakRefundRecheck = TRUE
    BreakRefundTiming  = FALSE
    MempoolExclusive   = TRUE
    FundIsIdempotent   = TRUE
    LockupReadIsReliable = TRUE
    AtomicAdmission    = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    L1OutcomeIsFinal
