\* EVM send corridor, CONTROL for EvmSend_BlindScan.cfg: the same lost txid
\* patch (TxidPatchAtomic = FALSE, the shipped write order) read through the
\* SHIPPED scan gate (ScanFollowsTheRow = TRUE).
\*
\* This is the artifact for the F2 fix.  BlindScan and this cfg differ in one
\* constant, and that constant is the gate: with the scan opening on the row
\* having entered locking_evm - a CAS that precedes the broadcast - a crash
\* that loses the patch costs a column, not a swap.
\*
\* READ THE CAVEAT before leaning on this run.  PatchTxid is unreachable in
\* this module - LockLands parks the worker, and PatchTxid needs one at phase
\* sentLock - so TxidPatchAtomic = FALSE means the txid is NEVER patched
\* rather than sometimes lost.  lockTxid is therefore constant in both this
\* cfg and the main one, and with the shipped gate it reaches no guard at
\* all: this run is green by ISOMORPHISM with EvmSend.cfg, identical counts
\* and all.  It establishes what it claims - a permanently null txid column
\* costs no money - but it does not explore a mixed window, and the module's
\* KNOWN-VACUOUS note carries the same warning.
\*
\* Liveness IS checked here, unlike the mutation cfgs: this run is expected to
\* complete, so there is no reason to leave the property unchecked.
\*
\* EXPECTED RESULT: green.  12,719,321 states generated, 1,705,266 distinct,
\* depth 46, 12min 14s (-workers 4).

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 5
    Amount     = 1
    MaxExposed = 2
    Phases     <- ESPhases
    Results    <- ESResults
    SpendKinds <- ESSpendKinds

    EvmTimeoutH    = 1
    RefundLocktime = 4
    ValidUntil     = 2
    MaxHeight      = 4
    FastCad        = 1
    SlowCad        = 2

    LockCommitFirst    = TRUE
    TxidPatchAtomic    = FALSE

    ScanFollowsTheRow  = TRUE
    RefundSeesClaim    = TRUE
    LockLandsPromptly  = TRUE
    TimeoutRefundCoversPresent = TRUE
    AtomicAdmission    = TRUE
    BreakDeadlineOrder = FALSE

INVARIANTS
    TypeOK
    NoDoubleLock
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    HeightSane

PROPERTIES
