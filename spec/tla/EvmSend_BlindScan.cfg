\* EVM send corridor, MUTATION: ScanFollowsTheRow (A5) = FALSE, restoring
\* the pre-fix gate, over TxidPatchAtomic = FALSE, which is the shipped
\* write order.  The txid patch is a separate write AFTER the lock broadcast
\* (evmOrchestrator.ts:355-356), so a crash in between leaves evm_lock_txid
\* null forever; the scan USED TO be gated on that txid and went blind with
\* it.  The client then claims the ERC20 invisibly: no scan fires, the
\* timeout refund takes the row, and the sats refund takes the rest.
\*
\* The lost patch is not the bug - EvmSend_LostPatch.cfg is this cfg with the
\* shipped gate, and it is GREEN over the same crash window.  The gate is.
\*
\* EXPECTED RESULT: invariant NoNetLoss violated (client claimed the ERC20
\* AND refunded its sats).  Liveness is not checked here; TLC stops at the
\* invariant violation.

\* RESULT: fires as expected.  See the module's MUTATION CHECKS for counts.

