\* MUTATION CHECK — arkade.fund GOES BACK TO HAVING NO IDEMPOTENCY KEY.
\*
\* One line differs from OnchainReceive.cfg: FundIsIdempotent = FALSE, which
\* is TODAY'S TYPESCRIPT, not a hypothetical regression.  The orchestrator
\* says so itself (src/receive/onchainOrchestrator.ts:401-408):
\*
\*     `IWallet.send` carries no idempotency key, so a blind resubmit after a
\*     crash between broadcast and this transition recording it would fund the
\*     Arkade lockup a SECOND time out of the solver's own pocket.
\*
\* The comment names the CRASH case; this cfg shows the CONCURRENT case is
\* worse, because it needs no crash at all.  whenFundingArkade is
\*
\*     const existing = await arkade.findLockups(row.pkScript)     <- read
\*     if (alreadyFunded) return store.transition(...)
\*     const txid = await arkade.fund({...})                       <- send
\*
\* Two awaits.  Two workers reading the same `funding_arkade` row both find
\* the lockup empty and both send.  The process-local reservation ledger
\* guarantees they pick DIFFERENT coins, which is exactly what lets BOTH
\* sends succeed.  Exactly one then wins the funding_arkade -> awaiting_claim
\* CAS and records ONE arkade_fund_txid; the second output is invisible to
\* the row forever, and the covenant claim leaf sweeps whole vtxos, so the
\* client can take both.
\*
\* Note the CAS is in the right place on this leg — awaiting_confirmations ->
\* funding_arkade is committed BEFORE the send (:395 then :417), which is
\* more than the Lightning receive leg does.  It still does not help: the CAS
\* gates ENTRY into the state, not OCCUPANCY of it, and the row sits in
\* `funding_arkade` for the whole duration of the send.  Today the only thing
\* preventing this is the in-process `inFlight` Set (:165, :282-291) plus
\* cli.ts's single sequential watch loop — both of which a Go rewrite deletes.
\*
\* EXPECTED RESULT: Invariant NoDoublePay is violated — arkFund[s] = 2, i.e.
\* the solver paid the same lockup twice out of its own float.
\*
\* LockupProvablySpent = FALSE — the shipped spendableOnly read, as in every
\* cfg here — supplies a SECOND, independent route to the same violation:
\* after a crash between the send and the CAS, a claim empties the
\* spendableOnly view, `alreadyFunded` reads false, and the recovery path
\* funds again.  That route needs only ONE worker.  An earlier revision of
\* this cfg set it TRUE to isolate concurrency from crash recovery; that also
\* made it the only cfg in the set whose `whenFundingArkade` matched the
\* TypeScript nowhere, so the isolation is now stated in prose instead.  The
\* shortest counterexample is still the two-reader one below.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- ORPhases
    Results    <- ORResults
    SpendKinds <- ORSpendKinds

    HtlcLocktime       = 4
    SettleSafetyMargin = 2
    RefundHorizon      = 2
    MinArkFundWindow   = 1
    LockupDeadline     = 1
    MinConfirmations   = 1
    MtpLag             = 1

    BreakDeadlineOrder  = FALSE
    BreakConfirmations  = FALSE
    FundIsIdempotent    = FALSE
    LockupProvablySpent = FALSE
    IndexerNeverLies    = TRUE
    ClaimFeeAffordable  = TRUE
    MempoolExclusive    = TRUE
    SettleNeedsConfirmation = TRUE
    AtomicAdmission     = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane
