\* MUTATION CHECK — NO CO-SIGNED L1 REFUND OF AN UNROLLED LOCKUP.
\*
\* LightningReceive.cfg with ONE line flipped: ServerCosignsOnchain = FALSE, an
\* arkd without CosignOnchainTx (before v0.9.22).  The server never censors.
\* Gate (d) prices the solver's solo leaf from the FUNDING tick, but a client
\* unroll restarts both solo CSVs at its own confirmation: unrolling at clock 2
\* or 3 puts our leaf at 6 or 7, not before E = 6, while the client's
\* (ClientClaimDelay 2) is already open.
\*
\* EXPECTED RESULT: Invariant NoNetLoss is violated — the client claims from E
\* on and the HTLC dies unsettled.  The green cfg, where arkd co-signs the
\* refundWithoutReceiver leaf on L1, is what closes it.

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 6
    Amount     = 1
    MaxExposed = 2
    Phases     <- LRPhases
    Results    <- LRResults
    SpendKinds <- LRSpendKinds

    RefundLocktime     = 3
    InvoiceExpiry      = 2
    MinSettleWindow    = 2
    SettleSafetyMargin = 1
    EmptyLockupGrace   = 1
    EChoices           = {2, 4, 6}
    UnilateralDelay    = 3
    RecourseMargin     = 2

    BreakSettleMargin    = FALSE
    BreakRecourseMargin  = FALSE
    BreakEmptyGrace      = FALSE
    ArkadeHonoursFundKey = TRUE
    FundGateOneShot      = TRUE
    AtomicAdmission      = TRUE
    SettleIsIdempotent   = TRUE
    ServerMayCensor      = FALSE
    ClientMayUnroll      = TRUE
    ClientClaimDelay     = 2
    ServerCosignsOnchain = FALSE
    MtpLag               = 1

INVARIANTS
    TypeOK
    NoDoubleFund
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    RecourseBeforeDeadline
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
