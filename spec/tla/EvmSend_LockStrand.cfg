\* EVM send corridor, MUTATION: TimeoutRefundCoversPresent (A7) = FALSE.
\* Restores the absence condition the locking_evm timeout refund USED TO
\* carry, which is what F5 was.  A lock that is present but never proven deep
\* (the depth probe lies / the node stalls: lockDepth.ts treats a failed read
\* as UNPROVEN, never absent) then parks the row past its own timeout.  The
\* client claims the ERC20 at any height - the contract does not gate the
\* claim on the timeout - and refunds its sats at the wall locktime.  The
\* double loss the margin exists to prevent, delivered through the one branch
\* that withheld the timeout.
\*
\* The shipped planner now reads the timeout BEFORE the presence
\* (evmSendPlan.ts:141-155), so this deletes a shipped guard rather than
\* recording shipped behaviour.
\*
\* EXPECTED RESULT: invariant NoNetLoss violated.  Liveness is not checked
\* here; TLC stops at the invariant violation.

\* RESULT: fires as expected.  See the module's MUTATION CHECKS for counts.

