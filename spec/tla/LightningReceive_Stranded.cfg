\* MUTATION CHECK — THE FUNDING GATE IS RE-EVALUATED AFTER FUNDING.
\*
\* FIVE lines differ from LightningReceive.cfg.  The mutation is
\* FundGateOneShot = FALSE, which is TODAY'S TYPESCRIPT; the other four are the
\* reduced bound set (MaxClock 4, EChoices {2,4}, UnilateralDelay 1,
\* RecourseMargin 1), which LightningReceive.cfg explains and shows does not
\* launder this result.  the orchestrator's whenArmed re-runs
\* evaluateReceiveFunding on EVERY armed tick, including a retry after
\* arkade.fund() has already succeeded and only the transition was lost.  So
\* the guard whose whole job is protecting money becomes the thing that
\* discards the recourse.
\*
\* The consequence is structural, not cosmetic.  `armed` is NOT in EXPOSED
\* (the SHAPE's `exposed` list in db/receiveSwaps.ts), so store.fail(id, 'armed', ...) routes to
\* `refused` rather than `stuck`.  `refused` is terminal, has no outgoing edge,
\* and THIS CORRIDOR HAS NO refundSweep.  The solver's float is stranded in the
\* lockup permanently, and no human is paged.
\*
\* EXPECTED RESULT: Invariant NoSilentLoss is violated — a terminal swap with
\* the solver's own sats irreversibly out, not collected, and the state is
\* `refused` rather than `stuck`.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions; this was
\* verified on LightningSend (SwapCore trap T4).  Pay the 4x instead.

\* The model deliberately goes quiescent once every swap is terminal and the
\* clock has reached MaxClock; that is the end of the modelled world, not a
\* stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- LRPhases
    Results    <- LRResults
    SpendKinds <- LRSpendKinds

    RefundLocktime     = 3
    InvoiceExpiry      = 2
    MinSettleWindow    = 2
    SettleSafetyMargin = 1
    EmptyLockupGrace   = 1
    EChoices           = {2, 4}
    UnilateralDelay    = 1
    RecourseMargin     = 1

    BreakSettleMargin    = FALSE
    BreakRecourseMargin  = FALSE
    BreakEmptyGrace      = FALSE
    ArkadeHonoursFundKey = TRUE
    FundGateOneShot      = FALSE
    AtomicAdmission      = TRUE
    SettleIsIdempotent   = TRUE
    ServerMayCensor      = FALSE

INVARIANTS
    TypeOK
    NoDoubleFund
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    RecourseBeforeDeadline
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
