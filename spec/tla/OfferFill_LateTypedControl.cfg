\* EXPECTED RESULT: GREEN. control: a typed refusal arriving AFTER the submission is harmless.
\*
\* OfferFill.cfg with LateTyped = TRUE: fillOffer's own failure comes back as
\* OfferNotSubmittedError, the mistake #331's typed boundary guarded against.
\* The walk-back still requires fill_phase = 'selecting' and the attempt has
\* already marked 'submitting', so the revert finds nothing to move. With the
\* latch in place the typed boundary is defence in depth, not the only guard.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Workers = {w1, w2}
    Legacy = {}
    MaxCrashes = 1
    MaxDeferrals = 1
    LegacyRow = FALSE
    Recovery = TRUE
    BreakLatch = FALSE
    BreakRevertGuard = FALSE
    BreakRevertReset = FALSE
    BreakLegacyReverted = FALSE
    LateTyped = TRUE

INVARIANTS
    NoDoubleFill
    LatchedNeverReady
    FilledMeansSent
    TypeOK

PROPERTIES
    FillingResolves
