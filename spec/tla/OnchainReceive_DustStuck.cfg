\* MUTATION CHECK — A FEE SPIKE PARKS AN ALREADY-PAID-OUT SWAP.
\*
\* One line differs from OnchainReceive.cfg: ClaimFeeAffordable = FALSE, which
\* enables whenClaimed's dust branch (:555-568):
\*
\*     if (payoutAmountSats < BigInt(ONCHAIN_DUST_SATS)) {
\*       await store.fail(row.id, 'claimed', `claim fee ... below the ... dust limit`)
\*       return false
\*     }
\*
\* Refusing to build a non-standard transaction is correct.  What this cfg
\* exposes is the STATE it refuses into.  On the sibling send leg the same
\* situation is recoverable — an operator runs reclaimOnchainHtlc() once fees
\* fall.  This leg has no operator command at all, and the code's own comment
\* concedes it: "this leg has no operator-retry command yet, so `stuck` is
\* where it parks pending one".  `stuck` is terminal, findRecoverable skips
\* it, and the swap it parks is one where the CLIENT ALREADY HAS THE SOLVER'S
\* ARKADE FLOAT.  Nobody sweeps the L1 HTLC, and at htlc_locktime the client
\* refunds that too.
\*
\* EXPECTED RESULT: Invariant NoNetLoss is violated.
\*
\* This is not a bug in a guard, it is a missing edge: the branch needs to be
\* retryable (leave the row in `claimed`, which is NON_TERMINAL and already
\* re-driven every sweep) rather than terminal, or the leg needs the send
\* leg's operator command.  Note the model is deliberately harsh — it makes
\* the fee unaffordable for the whole run — because the code's behaviour is
\* the same whether the spike lasts a minute or an hour: once the row is
\* `stuck`, a later cheap block cannot bring it back.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- ORPhases
    Results    <- ORResults
    SpendKinds <- ORSpendKinds

    HtlcLocktime       = 4
    SettleSafetyMargin = 2
    RefundHorizon      = 2
    MinArkFundWindow   = 1
    LockupDeadline     = 1
    MinConfirmations   = 1
    MtpLag             = 1

    BreakDeadlineOrder  = FALSE
    BreakConfirmations  = FALSE
    FundIsIdempotent    = TRUE
    LockupProvablySpent = FALSE
    IndexerNeverLies    = TRUE
    ClaimFeeAffordable  = FALSE
    MempoolExclusive    = TRUE
    AtomicAdmission     = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane
