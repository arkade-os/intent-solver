\* B10 — EXPECTED RESULT: GREEN with LeaseTtl = TRUE; Liveness violated with FALSE.
\*
\* OnchainSend_Liveness.cfg with CrashStrandsLease = TRUE.  A worker takes the
\* fund lease with funded -> funding_onchain and crashes before signing.
\* Without a TTL nothing clears fund_started_at and there is no output to
\* adopt, so the row stays live forever.  The TTL clears it; it is safe to
\* expire under a live holder only because PreCommitFunding records the
\* signed tx with a CAS before anything is broadcast.

SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions (SwapCore trap
\* T4, verified on LightningSend: symmetry on -> bogus liveness
\* counterexample, symmetry off -> no error).  Do not "optimise" this on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 3
    Amount     = 1
    MaxExposed = 1
    Phases     <- OSPhases
    Results    <- OSResults
    SpendKinds <- OSSpendKinds

    HtlcLocktime     = 1
    RefundMtpMargin  = 1
    MtpLag           = 1
    RefundLocktime   = 3
    MinFundWindow    = 2
    LockupDeadline   = 2
    MinConfirmations = 1
    RefundNeedsConfirmation = TRUE

    BreakRefundRecheck = FALSE
    BreakRefundTiming  = FALSE
    MempoolExclusive   = TRUE
    FundIsIdempotent   = FALSE
    LockupReadIsReliable = TRUE
    AtomicAdmission    = TRUE
    AtomicFundLease    = TRUE
    CrashStrandsLease  = TRUE
    PreCommitFunding   = TRUE
    LeaseTtl           = TRUE
    RecordIsCas        = TRUE
    RefuseNeedsNoTx    = TRUE

    ClientMayUnroll = TRUE
    ExitDelay       = 2
    ClaimsUnrolled  = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedNeverPaid
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    ForwardOnly
    L1OutcomeIsFinal
    Liveness
