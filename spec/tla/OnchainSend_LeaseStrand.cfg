\* B10 — EXPECTED RESULT: Liveness violated.  RED ON THE SHIPPED CODE.
\*
\* OnchainSend_Liveness.cfg with CrashStrandsLease = TRUE.  A worker takes the
\* fund lease with funded -> funding_onchain, crashes before fund(), and the
\* row sits in funding_onchain for good: fund_started_at is never cleared,
\* and with nothing on the chain there is no output for recoverFunding to
\* adopt.  Nothing is lost — fundOut stays 0 and the client's refund path
\* opens — but the row stays live and counted against the exposure cap.
\* A lease TTL is only sound once fund() has a deadline it cannot outlive.

SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions (SwapCore trap
\* T4, verified on LightningSend: symmetry on -> bogus liveness
\* counterexample, symmetry off -> no error).  Do not "optimise" this on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 3
    Amount     = 1
    MaxExposed = 1
    Phases     <- OSPhases
    Results    <- OSResults
    SpendKinds <- OSSpendKinds

    HtlcLocktime     = 1
    RefundMtpMargin  = 1
    MtpLag           = 1
    RefundLocktime   = 3
    MinFundWindow    = 2
    LockupDeadline   = 2
    MinConfirmations = 1
    RefundNeedsConfirmation = TRUE

    BreakRefundRecheck = FALSE
    BreakRefundTiming  = FALSE
    MempoolExclusive   = TRUE
    FundIsIdempotent   = TRUE
    LockupReadIsReliable = TRUE
    AtomicAdmission    = TRUE
    AtomicFundLease    = TRUE
    CrashStrandsLease  = TRUE

    ClientMayUnroll = TRUE
    ExitDelay       = 2
    ClaimsUnrolled  = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedNeverPaid
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    ForwardOnly
    L1OutcomeIsFinal
    Liveness
