\* EVM receive corridor, CONTROL for EvmReceive_RefundStrand.cfg: the same
\* split refund (RefundSpendAtomic = FALSE, the shipped three-step shell)
\* read through the SHIPPED planner (RefundRedrivenWhileUnspent = TRUE).
\*
\* This is the artifact for the F4 fix.  RefundStrand and this cfg differ in
\* one constant, and that constant is the re-drive: with the planner
\* returning refund_arkade for as long as the covenant reads unspent, a crash
\* between the CAS and the spend costs a tick, not a swap.
\*
\* Liveness IS checked here, unlike the mutation cfgs: this run is expected to
\* complete, so there is no reason to leave the property unchecked.
\*
\* EXPECTED RESULT: green.

SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED (SwapCore trap T4).

\* The model deliberately goes quiescent once every swap is terminal (or
\* crash-parked) and both clocks have reached their bound; that is the end
\* of the modelled world, not a stuck system.  Liveness is what checks for
\* real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- ERPhases
    Results    <- ERResults
    SpendKinds <- ERSpendKinds

    EvmTimeoutH       = 3
    ClaimMarginBlocks = 1
    RefundLocktime    = 2
    ValidUntil        = 2
    MaxHeight         = 5
    FastCad           = 1
    SlowCad           = 2

    FundCommitFirst    = TRUE
    ClaimLandsPromptly = TRUE
    ClaimRecordsReceipt = TRUE
    FundLandsPromptly  = TRUE
    RefundSpendAtomic  = FALSE

    RefundRedrivenWhileUnspent = TRUE
    AtomicAdmission    = TRUE
    BreakDeadlineOrder = FALSE

INVARIANTS
    TypeOK
    NoDoubleFund
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    HeightSane

PROPERTIES
    ForwardOnly
    Liveness
