\* CONTROL FOR THE EXPOSURE-CAP MUTATION — THE CHECK MOVES INTO THE WRITE.
\*
\* Identical to OnchainReceive_Overexposed.cfg except AtomicAdmission = TRUE,
\* i.e. quote()'s INSERT re-evaluates committedSats() + amount <= cap in the
\* same conditional write that consumes the capacity:
\*
\*     INSERT INTO receive_onchain_swap (...)
\*     SELECT ... WHERE (SELECT COALESCE(SUM(amount_sats),0)
\*                       FROM receive_onchain_swap
\*                       WHERE state IN (<NON_TERMINAL>)) + ? <= ?
\*
\* EXPECTED RESULT: GREEN.  The cap binds (MaxExposed = 1, two swaps of
\* Amount 1), the losing quote lands in `rejected`, and ExposureBounded holds
\* under every interleaving of two concurrent handlers.
\*
\* This is also the only cfg in the set that exercises the `rejected` state
\* and therefore the spec-only `none -> rejected` edge; in every other model
\* the cap never binds.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 1
    Phases     <- ORPhases
    Results    <- ORResults
    SpendKinds <- ORSpendKinds

    HtlcLocktime       = 4
    SettleSafetyMargin = 2
    RefundHorizon      = 2
    MinArkFundWindow   = 1
    LockupDeadline     = 1
    MinConfirmations   = 1
    MtpLag             = 1

    BreakDeadlineOrder  = FALSE
    BreakConfirmations  = FALSE
    FundIsIdempotent    = TRUE
    LockupProvablySpent = FALSE
    IndexerNeverLies    = TRUE
    ClaimFeeAffordable  = TRUE
    MempoolExclusive    = TRUE
    SettleNeedsConfirmation = TRUE
    AtomicAdmission     = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    ForwardOnly
    Liveness
