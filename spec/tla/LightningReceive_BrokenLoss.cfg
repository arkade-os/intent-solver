\* MUTATION CHECK — SETTLE_SAFETY_MARGIN REMOVED, MONEY INVARIANT ONLY.
\*
\* Identical mutation to LightningReceive_Broken.cfg (BreakSettleMargin = TRUE).
\* The only difference is the invariant list: RecourseBeforeDeadline is the
\* guard's DIRECT statement and fires first, one tick before the money actually
\* moves.  This cfg checks NoNetLoss alone so the trace TLC prints is the
\* OUTRIGHT LOSS itself — the client takes the Arkade lockup the solver funded
\* out of its own float, and the held HTLC dies unsettled, so both legs are
\* gone.
\*
\* EXPECTED RESULT: Invariant NoNetLoss is violated.  The trace is reproduced
\* in the comment block at the end of LightningReceive.tla.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- LRPhases
    Results    <- LRResults
    SpendKinds <- LRSpendKinds

    RefundLocktime     = 3
    InvoiceExpiry      = 2
    MinSettleWindow    = 2
    SettleSafetyMargin = 1
    EmptyLockupGrace   = 1
    EChoices           = {2, 4}
    UnilateralDelay    = 1
    RecourseMargin     = 1

    BreakSettleMargin    = TRUE
    BreakRecourseMargin  = FALSE
    BreakEmptyGrace      = FALSE
    ArkadeHonoursFundKey = TRUE
    FundGateOneShot      = TRUE
    AtomicAdmission      = TRUE
    SettleIsIdempotent   = TRUE
    ServerMayCensor      = FALSE

INVARIANTS
    NoNetLoss
