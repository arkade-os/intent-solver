\* MUTATION CHECK — MIN_CLAIM_WINDOW REMOVED.
\*
\* One line differs from LightningSend.cfg: BreakClaimWindow = TRUE, which
\* deletes this conjunct from evaluateSendPayment (src/core/send.ts:246-248):
\*
\*     if (refundLocktime - now < MIN_CLAIM_WINDOW)
\*       return { pay: false, reason: 'claim_window_too_short' }
\*
\* EXPECTED RESULT: Invariant NoNetLoss is violated — the solver pays the
\* BOLT11 and the client pulls the Arkade lockup back, both legs gone.
\* The trace is reproduced in the comment block at the end of
\* LightningSend.tla.
\*
\* Liveness is not checked here; TLC stops at the invariant violation.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions: with
\* `SYMMETRY Perms` this exact model reports a liveness counterexample whose
\* cycle leaves a payment in flight forever while WF(ResolvePayment(s1)) says
\* it must resolve.  The cycle exists only in the quotient graph.  Verified by
\* running the same model with symmetry off, where TLC reports no error.
\* Corridor authors: do not "optimise" this back on.

\* The model deliberately goes quiescent once every swap is terminal and the
\* clock has reached MaxClock; that is the end of the modelled world, not a
\* stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- LSPhases
    Results    <- LSResults
    SpendKinds <- LSSpendKinds

    RefundLocktime   = 3
    MinClaimWindow   = 2
    MinInvoiceWindow = 1
    InvoiceExpiry    = 4
    LockupDeadline   = 3
    HtlcMaxLifetime  = 1

    BreakClaimWindow          = TRUE
    BackendHonoursIdempotency = TRUE
    AtomicAdmission           = TRUE
    IndexerNeverLies          = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
