\* FINDING CHECK — settleHold IS NOT A NO-OP ON AN ALREADY-SETTLED HOLD.
\*
\* One line differs from LightningReceive.cfg: SettleIsIdempotent = FALSE.
\*
\* This is not a mutation of a guard either.  It fixes a property of the
\* LIGHTNING BACKEND that the row cannot observe, and shows what the corridor
\* does when it is unfavourable.  ln.settleHold(P) runs BEFORE the
\* claimed->settled compare-and-swap (src/receive/orchestrator.ts:474-475), and
\* there is NO data-fact column for it — no `settled_at` analogous to
\* `revealed_at` — so a resumed process cannot tell "not yet attempted" from
\* "already succeeded".  It simply calls settleHold again.  If the backend
\* treats that as an error rather than a no-op, the catch fires; before E the
\* error is re-thrown and the row retries, and once E passes whenClaimed
\* escalates to terminal `stuck` with "settle failing past E".
\*
\* EXPECTED RESULT: GREEN.  The swap was in fact COLLECTED, so no money
\* invariant is violated — but the row lies, and this is the one configuration
\* in which SettleGivesUp and the claimed -> stuck edge are reachable at all.
\* It is a FALSE-NEGATIVE `stuck`, and `stuck` is terminal with no outgoing
\* edge, so the swap can never correct itself.  The Go fix is a pre-committed
\* settle_attempted_at, mirroring revealed_at.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions; this was
\* verified on LightningSend (SwapCore trap T4).  Pay the 4x instead.

\* The model deliberately goes quiescent once every swap is terminal and the
\* clock has reached MaxClock; that is the end of the modelled world, not a
\* stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- LRPhases
    Results    <- LRResults
    SpendKinds <- LRSpendKinds

    RefundLocktime     = 3
    InvoiceExpiry      = 2
    MinSettleWindow    = 2
    SettleSafetyMargin = 1
    EmptyLockupGrace   = 1
    EChoices           = {2, 4}
    UnilateralDelay    = 1
    RecourseMargin     = 1

    BreakSettleMargin    = FALSE
    BreakRecourseMargin  = FALSE
    BreakEmptyGrace      = FALSE
    ArkadeHonoursFundKey = TRUE
    FundGateOneShot      = TRUE
    AtomicAdmission      = TRUE
    SettleIsIdempotent   = FALSE
    ServerMayCensor      = FALSE

INVARIANTS
    TypeOK
    NoDoubleFund
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    RecourseBeforeDeadline
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed

PROPERTIES
    ForwardOnly
    Liveness
