\* CONTROL FOR OnchainSend_Overexposed.cfg — THE FIX, NOT THE BUG.
\*
\* Identical to OnchainSend_Overexposed.cfg (MaxExposed = 1, so the cap
\* genuinely binds with two swaps of Amount 1) except AtomicAdmission = TRUE:
\* quote()'s INSERT re-evaluates committedSats() + amount <= cap in the same
\* conditional write that consumes the capacity:
\*
\*     INSERT INTO send_onchain_swap (...)
\*     SELECT ... WHERE (SELECT COALESCE(SUM(amount_sats),0)
\*                       FROM send_onchain_swap
\*                       WHERE state IN (<NON_TERMINAL>)) + ? <= ?
\*
\* EXPECTED RESULT: GREEN.  The cap binds, the losing quote lands in
\* `rejected`, and ExposureBounded holds under every interleaving of two
\* concurrent handlers.
\*
\* This is what makes the mutation check a proof that folding the cap into
\* the write is SUFFICIENT and not merely plausible — without it, a green
\* run could just mean the cap never binds.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions (SwapCore trap
\* T4, verified on LightningSend: symmetry on -> bogus liveness
\* counterexample, symmetry off -> no error).  Do not "optimise" this on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 3
    Amount     = 1
    MaxExposed = 1
    Phases     <- OSPhases
    Results    <- OSResults
    SpendKinds <- OSSpendKinds

    HtlcLocktime     = 1
    RefundMtpMargin  = 1
    MtpLag           = 1
    RefundLocktime   = 3
    MinFundWindow    = 2
    LockupDeadline   = 2
    MinConfirmations = 1

    BreakRefundRecheck = FALSE
    BreakRefundTiming  = FALSE
    MempoolExclusive   = TRUE
    FundIsIdempotent   = TRUE
    LockupReadIsReliable = TRUE
    AtomicAdmission    = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    L1OutcomeIsFinal

\* Liveness is checked only in OnchainSend.cfg; see OnchainSend_RefundTiming.cfg.
