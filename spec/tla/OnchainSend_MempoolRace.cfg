\* THE RBF RACE, WITH THE SHIPPED GUARD ON.  Not green, and deliberately kept.
\*
\* MempoolExclusive = FALSE lets a conflicting spend of the L1 outpoint be
\* relayed and confirmed after the solver's refund has already been broadcast
\* — which is what src/onchain/refund.ts actually asks for by setting the input
\* sequence to 0xfffffffd.  That value enables nLockTime AND SIGNALS OPT-IN
\* RBF; 0xfffffffe would enable the locktime without the second half.
\*
\* This cfg used to violate NoSilentLoss, and that was the module's
\* highest-value finding: `refunded` recorded a BROADCAST, so a client claim
\* that won the replacement race left a terminal row lying over money nobody
\* would look at again.  #204 fixed that half — the row now holds in
\* refunding_onchain until `transactionOutcome` on its own pre-committed txid
\* reports the spend mined, and reads the claim instead when the claim is what
\* landed.  NoSilentLoss is unreachable here now.
\*
\* EXPECTED RESULT: Invariant NoNetLoss is violated, and this is the honest
\* residual rather than a regression.  ESTABLISHED, not assumed: running this
\* cfg with the guard OFF **and NoSilentLoss deleted from the invariant list**
\* also violates NoNetLoss (528,846 states, 92,647 distinct).  So the loss was
\* already reachable before #204 and TLC merely stopped at the silent one
\* first.
\*
\* What is left is the claim race the send orchestrator already names in
\* whenAwaitingClaim's `claim race:` warning: a client claim can replace the
\* refund, and a solver slow to notice can still find refund_locktime past and
\* the lockup pulled back.  Closing it needs a timelock or a fee-bump policy,
\* not a state-machine change.  Fix shapes for Go: stop signalling RBF on the
\* refund, or bump the refund's fee as htlc_locktime recedes.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions (SwapCore trap
\* T4, verified on LightningSend: symmetry on -> bogus liveness
\* counterexample, symmetry off -> no error).  Do not "optimise" this on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 3
    Amount     = 1
    MaxExposed = 2
    Phases     <- OSPhases
    Results    <- OSResults
    SpendKinds <- OSSpendKinds

    HtlcLocktime     = 1
    RefundMtpMargin  = 1
    MtpLag           = 1
    RefundLocktime   = 3
    MinFundWindow    = 2
    LockupDeadline   = 2
    MinConfirmations = 1
    RefundNeedsConfirmation = TRUE

    BreakRefundRecheck = FALSE
    BreakRefundTiming  = FALSE
    MempoolExclusive   = FALSE
    FundIsIdempotent   = TRUE
    LockupReadIsReliable = TRUE
    AtomicAdmission    = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane
