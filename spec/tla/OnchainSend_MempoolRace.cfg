\* MUTATION CHECK — THE REFUND BROADCAST CAN BE REPLACED.
\*
\* MempoolExclusive = FALSE lets a conflicting spend of the L1 outpoint be
\* relayed and confirmed after the solver's refund has already been broadcast
\* — which is what src/onchain/refund.ts actually asks for by setting the
\* input sequence to 0xfffffffd.  That value enables nLockTime AND SIGNALS
\* OPT-IN RBF; 0xfffffffe would enable the locktime without the second half.
\*
\* This is the TOCTOU the code concedes it cannot close: the pre-broadcast
\* findSpendWitness is a point-in-time snapshot, `refunded` records a
\* BROADCAST rather than a confirmation, and `refunded` is terminal and absent
\* from NON_TERMINAL, so findRecoverable() never looks at the row again.
\*
\* EXPECTED RESULT: Invariant NoSilentLoss is violated.  The row is terminal
\* `refunded` while the transaction that actually confirmed is the client's
\* claim: the solver's L1 sats are gone, P was revealed on a witness nobody
\* ever read, the Arkade lockup is never claimed, and nothing pages a human.
\*
\* This is the corridor's worst outcome and the highest-value thing in the
\* whole module.  Fix shapes for Go: stop signalling RBF on the refund, or
\* keep the row drivable until the refund has confirmation depth.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions (SwapCore trap
\* T4, verified on LightningSend: symmetry on -> bogus liveness
\* counterexample, symmetry off -> no error).  Do not "optimise" this on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 3
    Amount     = 1
    MaxExposed = 2
    Phases     <- OSPhases
    Results    <- OSResults
    SpendKinds <- OSSpendKinds

    HtlcLocktime     = 1
    RefundMtpMargin  = 1
    MtpLag           = 1
    RefundLocktime   = 3
    MinFundWindow    = 2
    LockupDeadline   = 2
    MinConfirmations = 1

    BreakRefundRecheck = FALSE
    BreakRefundTiming  = FALSE
    MempoolExclusive   = FALSE
    FundIsIdempotent   = TRUE
    LockupReadIsReliable = TRUE
    AtomicAdmission    = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    L1OutcomeIsFinal
