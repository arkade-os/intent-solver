\* EXPECTED RESULT: NoDoubleFill violated.
\*
\* OfferFill.cfg with BreakRejectedProof = TRUE: the rejection is classified over
\* a submission arkd may have TAKEN, which is what reading the refusal loosely
\* amounts to — matching on the message prose, or on an outpoint list that names
\* the deposit beside one of our own coins (the shape a fill of ours that landed
\* also produces). The walk-back then re-offers a row that already spent.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Workers = {w1, w2}
    Legacy = {}
    MaxCrashes = 1
    MaxDeferrals = 1
    LegacyRow = FALSE
    Recovery = TRUE
    BreakLatch = FALSE
    BreakRejectedProof = TRUE
    BreakRejectedGuard = FALSE
    BreakRevertGuard = FALSE
    BreakRevertReset = FALSE
    BreakLegacyReverted = FALSE
    LateTyped = FALSE

INVARIANTS
    NoDoubleFill
    LatchedNeverReady
    FilledMeansSent
    TypeOK
