\* FINDING CHECK — THE ARKADE SERVER STOPS CO-SIGNING.
\*
\* One line differs from LightningReceive.cfg: ServerMayCensor = TRUE.
\*
\* This is not a mutation of a guard; it turns on an environment behaviour.
\* Before the solo exit was modelled (gate (d), 2026-08) this cfg was the F5
\* finding: every leaf of the covenant that can move the lockup keeps the
\* Arkade server in its signer set — the solver's refundWithoutReceiver just
\* as much as the client's claim — so a censoring server froze both sides.
\* whenRefunding's arkade.refund() throws, tickAll's onTickError records it,
\* the row stays `refunding`, and the next sweep retries forever.  Liveness
\* was violated, and that WAS the shipped TypeScript.
\*
\* With the solo leaves modelled, the EXPECTED RESULT CHANGED to GREEN -
\* safety AND Liveness (2,729,200 gen / 430,350 distinct, 26m13s, -workers 4).
\* The covenant's solo leaves carry NO server signature; once the refund
\* deadline has passed, a funded row's matured solo refund (fundedAt +
\* UnilateralDelay, strictly before E whenever gate (d) holds) is work the
\* solver could finish RIGHT NOW, and Urgent holds the clock until it does.
\* The trader's solo claim opens only at E — strictly later — so the exit is
\* FAIR and every swap reaches a terminal state.
\*
\* What is STILL true of the shipped TypeScript: no src/ code spends the
\* solver's solo leaf yet (TODO(unilateral-exit) in src/arkade/covenant.ts),
\* so a censoring server still parks the float in production.  F5 survives
\* as a finding about shipped code, not about the covenant; this cfg is the
\* requirement evidence the Go rewrite must keep passing, and
\* LightningReceive_RecourseMargin.cfg breaks the gate that keeps the race
\* fair.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions; this was
\* verified on LightningSend (SwapCore trap T4).  Pay the 4x instead.

\* The model deliberately goes quiescent once every swap is terminal and the
\* clock has reached MaxClock; that is the end of the modelled world, not a
\* stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- LRPhases
    Results    <- LRResults
    SpendKinds <- LRSpendKinds

    RefundLocktime     = 3
    InvoiceExpiry      = 2
    MinSettleWindow    = 2
    SettleSafetyMargin = 1
    EmptyLockupGrace   = 1
    EChoices           = {2, 4}
    UnilateralDelay    = 1
    RecourseMargin     = 1

    BreakSettleMargin    = FALSE
    BreakRecourseMargin  = FALSE
    BreakEmptyGrace      = FALSE
    ArkadeHonoursFundKey = TRUE
    FundGateOneShot      = TRUE
    AtomicAdmission      = TRUE
    SettleIsIdempotent   = TRUE
    ServerMayCensor      = TRUE

INVARIANTS
    TypeOK
    NoDoubleFund
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    RecourseBeforeDeadline
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
PROPERTIES
    Liveness
