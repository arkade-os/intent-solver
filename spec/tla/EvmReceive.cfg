\* EVM receive corridor - the green model.
\*
\* 2 swaps, 2 workers, wall clock bounded to 0..4, EVM height to 0..5,
\* height advancing inside the cadence band [FastCad, SlowCad] = [1, 2].
\*
\* Only the RELATIVE ORDERING of the deadlines is modelled, because that
\* ordering is all the guards compare.  Scaled from src/core/evmReceive.ts
\* and the planner's RULE 2 (evmReceivePlan.ts:31, 60 blocks; here 1):
\*
\*     refund_locktime (wall)   < evmTimeout (height) * FastCad  (R1)
\*     RefundLocktime 2         < EvmTimeoutH 3 * 1               margin holds
\*
\*     fund requires: confirmed lock, height + ClaimMarginBlocks 1 <
\*     EvmTimeoutH 3, quote not stale (clock < ValidUntil 2)
\*
\* Consequences, all of them exercised:
\*   - a client that never locks is refused at ValidUntil (RULE 5)
\*   - a lock confirmed late in the window is refused (RULE 2)
\*   - the solver's sats refund opens at wall 2, strictly before the
\*     client's ERC20 refund could open even at the fastest cadence
\*     (height 3 needs wall >= 3), so a late preimage finds the sats
\*     already home
\*   - a preimage in hand at height >= 3 sticks the row, loudly (RULE 4)
\*
\* EXPECTED RESULT: green.  All assumptions at their safe settings:
\* FundCommitFirst (B1), ClaimLandsPromptly (B2), ClaimRecordsReceipt (B3),
\* FundLandsPromptly (B4), RefundSpendAtomic (B5) TRUE; AtomicAdmission
\* TRUE; BreakDeadlineOrder FALSE.  Every mutation has its own cfg; see the
\* module's MUTATION CHECKS.
\*
\* RESULT: green.  3,115,999 states generated, 427,805 distinct, depth 47,
\* 1min 10s (-workers 4).  All nine invariants, ForwardOnly, and Liveness
\* (terminal or crash-parked in funding_arkade/refunding_arkade, F1).

SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED (SwapCore trap T4).

\* The model deliberately goes quiescent once every swap is terminal (or
\* crash-parked) and both clocks have reached their bound; that is the end
\* of the modelled world, not a stuck system.  Liveness is what checks for
\* real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- ERPhases
    Results    <- ERResults
    SpendKinds <- ERSpendKinds

    EvmTimeoutH       = 3
    ClaimMarginBlocks = 1
    RefundLocktime    = 2
    ValidUntil        = 2
    MaxHeight         = 5
    FastCad           = 1
    SlowCad           = 2

    FundCommitFirst    = TRUE
    ClaimLandsPromptly = TRUE
    ClaimRecordsReceipt = TRUE
    FundLandsPromptly  = TRUE
    RefundSpendAtomic  = TRUE

    RefundRedrivenWhileUnspent = TRUE
    AtomicAdmission    = TRUE
    BreakDeadlineOrder = FALSE

INVARIANTS
