\* EXPECTED RESULT: LostOnlyWhenGone violated.
\*
\* OfferFill.cfg with BreakProbeProof = TRUE: the probe answers "gone" without
\* the indexer naming a foreign spender — which is what going terminal on the
\* absence read itself amounts to. A deposit still fillable is then written off
\* as `lost`, and on the packet path that cannot be undone: the relay streams
\* only NEW funding transactions, so the row is never rediscovered.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Workers = {w1, w2}
    Legacy = {}
    MaxCrashes = 1
    MaxDeferrals = 1
    LegacyRow = FALSE
    Recovery = TRUE
    BreakLatch = FALSE
    BreakProbeProof = TRUE
    BreakRejectedProof = FALSE
    BreakRejectedGuard = FALSE
    BreakRevertGuard = FALSE
    BreakRevertReset = FALSE
    BreakLegacyReverted = FALSE
    LateTyped = FALSE

INVARIANTS
    NoDoubleFill
    LostOnlyWhenGone
    LatchedNeverReady
    FilledMeansSent
    TypeOK
