\* MUTATION CHECK — THE CONFIRMATION DEPTH GATE BECOMES VACUOUS.
\*
\* One line differs from OnchainReceive.cfg: BreakConfirmations = TRUE, which
\* makes this test in whenAwaitingConfirmations (:382) always pass:
\*
\*     const confirmed = (output?.confirmations ?? 0) >= row.minConfirmations
\*
\* That is not a hypothetical.  min_confirmations is clamped with
\*
\*     Math.min(request.minConfirmations ?? 1, 6)      core/onchainReceive.ts:148
\*
\* and there is NO matching Math.max(1, ...).  A caller passing 0 makes the
\* comparison `>= 0`, which is true for a shallow output — and, because of the
\* `?? 0`, ALSO TRUE FOR A MISSING ONE.  Unreachable over the wire today (the
\* RFQ profile schema carries no min_confirmations field,
\* src/wire/onchainReceivePayloads.ts:68-80) and reachable from any internal
\* caller.
\*
\* min_confirmations IS this corridor's entire reorg policy.  It is checked
\* exactly once, at the awaiting_confirmations -> funding_arkade edge, and
\* nothing re-validates it after the solver has paid out: whenClaimed only
\* calls findSpendWitness on the recorded outpoint, and a vanished outpoint
\* returns null, which reads identically to "unspent".  There is no state, no
\* column and no edge that names "the client's funding output disappeared
\* after we funded Arkade".
\*
\* EXPECTED RESULT: Invariant NoNetLoss is violated — the solver pays its own
\* Arkade float against an L1 HTLC that is not (or not yet) irreversibly
\* there, the client claims the Arkade lockup, and the solver's only recourse
\* never existed or was reorged out from under it.
\*
\* Liveness is not checked here; TLC stops at the invariant violation.  Note
\* that it would ALSO fail: a `claimed` row whose L1 outpoint has vanished
\* retries broadcastRaw forever with no terminal state to fall into.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
