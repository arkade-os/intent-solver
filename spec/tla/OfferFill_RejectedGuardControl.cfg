\* EXPECTED RESULT: GREEN, and that is the finding.
\*
\* OfferFill.cfg with BreakRejectedGuard = TRUE: the two rejected exits match on
\* state = 'filling' alone, dropping fill_phase = 'submitting'. Unlike
\* OfferFill_RevertGuard.cfg one phase earlier, this does NOT double-fill — the
\* latch already decides who can reach a rejection at all, so no second attempt
\* can be holding the row when the exit lands. Checked GREEN at two workers and
