\* EXPECTED RESULT: GREEN. control for _RevertReset: an old process still running, the reset restored.
\*
\* OfferFill.cfg with w2 on the version before fill_phase, on a row that starts
\* `fillable`: the rolling deploy. w2 claims without stamping a phase, submits
\* without marking, and skips a row it finds `filling`. Because a walk-back
\* clears the phase, a row w2 claims reads as phase-less, and recovery
\* escalates it instead of walking it back.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Workers = {w1, w2}
    Legacy = {w2}
    MaxCrashes = 1
    MaxDeferrals = 1
    LegacyRow = FALSE
    Recovery = TRUE
    BreakLatch = FALSE
    BreakRevertGuard = FALSE
    BreakRevertReset = FALSE
    BreakLegacyReverted = FALSE
    LateTyped = FALSE

INVARIANTS
    NoDoubleFill
    LatchedNeverReady
    FilledMeansSent
    TypeOK

PROPERTIES
    FillingResolves
