\* EXPECTED RESULT: NoDoubleFill violated.
\*
\* OfferFill.cfg with BreakLatch = TRUE: markSubmitting stops requiring
\* fill_phase = 'selecting'. A sweep walks back an attempt still selecting, a
\* second attempt claims, and both reach markSubmitting; without the phase in
\* the WHERE clause both win, and both fill.

SPECIFICATION Spec
