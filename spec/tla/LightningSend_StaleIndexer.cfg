\* MUTATION CHECK — THE ARKADE INDEXER REPORTS [] FOR A LIVE LOCKUP.
\*
\* IndexerNeverLies = FALSE lets arkade.findLockups() return [] while the
\* lockup is still there and still claimable.  whenClaiming reads that as
\* "lockup empty while claiming with no claim txid recorded" and routes the
\* row to terminal `stuck` (src/send/orchestrator.ts:631-645) — deliberately,
\* because it cannot tell a stale read from a real loss.
\*
\* EXPECTED RESULT: Invariant NoNetLoss is violated.  The row is parked in
\* `stuck` with the preimage on disk and the lockup untouched; nothing
\* automatic ever retries (findRecoverable skips terminal states), the clock
\* runs past refund_locktime, and the client refunds the lockup the solver had
\* already paid for.
\*
\* This is NOT a bug in the empty-read handling — routing to `stuck` is the
\* right call and the comment there argues it correctly.  It is a bug in the
\* RECOVERY story: `stuck` has no outgoing edge and no operator claim command
\* on this corridor, so the false negative the code accepts as "costs a
\* glance" costs the full amount if nobody glances before refund_locktime.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions: with
\* `SYMMETRY Perms` this exact model reports a liveness counterexample whose
\* cycle leaves a payment in flight forever while WF(ResolvePayment(s1)) says
\* it must resolve.  The cycle exists only in the quotient graph.  Verified by
\* running the same model with symmetry off, where TLC reports no error.
\* Corridor authors: do not "optimise" this back on.

\* The model deliberately goes quiescent once every swap is terminal and the
\* clock has reached MaxClock; that is the end of the modelled world, not a
\* stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- LSPhases
    Results    <- LSResults
    SpendKinds <- LSSpendKinds

    RefundLocktime   = 3
    MinClaimWindow   = 2
    MinInvoiceWindow = 1
    InvoiceExpiry    = 4
    LockupDeadline   = 3
    HtlcMaxLifetime  = 1

    BreakClaimWindow          = FALSE
    BackendHonoursIdempotency = TRUE
    AtomicAdmission           = TRUE
    IndexerNeverLies          = FALSE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
