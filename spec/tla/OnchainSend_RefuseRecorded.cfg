\* MUTATION CHECK — THE FRESH REFUSAL IGNORES funding_tx.  EXPECTED: RefusedNeverPaid violated.
\*
\* OnchainSend_Liveness.cfg with RefuseNeedsNoTx = FALSE: submitFunding's
\* fresh-entry refusal (funding_onchain -> refused) CASes on state alone.
\* The TTL expires under the fresh worker, a recovery worker takes the lease
\* and records a tx, the client unrolls, the fresh worker's re-check refuses
\* the row, and the recovery worker then broadcasts the tx it recorded.  The
\* refusal CAS must also require `funding_tx IS NULL`.

SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions (SwapCore trap
\* T4, verified on LightningSend: symmetry on -> bogus liveness
\* counterexample, symmetry off -> no error).  Do not "optimise" this on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 3
    Amount     = 1
    MaxExposed = 1
    Phases     <- OSPhases
    Results    <- OSResults
    SpendKinds <- OSSpendKinds

    HtlcLocktime     = 1
    RefundMtpMargin  = 1
    MtpLag           = 1
    RefundLocktime   = 3
    MinFundWindow    = 2
    LockupDeadline   = 2
    MinConfirmations = 1
    RefundNeedsConfirmation = TRUE

    BreakRefundRecheck = FALSE
    BreakRefundTiming  = FALSE
    MempoolExclusive   = TRUE
    FundIsIdempotent   = FALSE
    LockupReadIsReliable = TRUE
    AtomicAdmission    = TRUE
    AtomicFundLease    = TRUE
    CrashStrandsLease  = FALSE
    PreCommitFunding   = TRUE
    LeaseTtl           = TRUE
    RecordIsCas        = TRUE
    RefuseNeedsNoTx    = FALSE

    ClientMayUnroll = TRUE
    ExitDelay       = 2
    ClaimsUnrolled  = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedNeverPaid
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    ForwardOnly
    L1OutcomeIsFinal
    Liveness
