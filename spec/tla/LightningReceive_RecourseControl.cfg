\* CONTROL FOR LightningReceive_RecourseMargin.cfg — GATE (d) INTACT, UNDER CENSORSHIP.
\*
\* Identical to LightningReceive_RecourseMargin.cfg (ServerMayCensor = TRUE,
\* UnilateralDelay 3, RecourseMargin 2, EChoices {2,4,6}) except
\* BreakRecourseMargin = FALSE.  The gate decides both ways at these
\* constants:
\*
\*   - E = 4 passes gates (a)-(c) and is refused by gate (d) alone
\*     (0 + 3 + 2 > 4): the swap is declined before any money moves, which
\*     is the entire content of the #69 fix.
\*   - E = 6 is admitted at clocks 0 and 1, and once funded the solver's solo
\*     refund matures at fundedAt + UnilateralDelay = 4 or 5.  Even under
\*     censorship — co-signed refund unavailable, (A2)'s clock freeze relaxed
\*     because no recovery action exists until then — the matured leaf is
\*     solver work (fair, like every other solver act), the clock freezes
\*     while it is urgent, and the refund lands strictly before E = 6.
\*     The trader's solo claim is enabled only from E on and finds the
\*     outpoint already spent.
\*
\* EXPECTED RESULT: GREEN.  Without this control the RecourseMargin
\* violation could be read as a property of UnilateralDelay 3 alone; with the
\* gate restored at the same constants and the same censor, nothing fires.
\*
\* Liveness is deliberately not checked: ArmHtlc is environment-unfair, so a
\* quoted row can languish forever by design, and the F5 finding
\* (LightningReceive_Censored.cfg) owns the censorship-liveness story.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions; this was
\* verified on LightningSend (SwapCore trap T4).  Pay the 4x instead.

\* The model deliberately goes quiescent once every swap is terminal and the
\* clock has reached MaxClock; that is the end of the modelled world, not a
\* stuck system.  Liveness is what checks for real stalls elsewhere.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 6
    Amount     = 1
    MaxExposed = 2
    Phases     <- LRPhases
    Results    <- LRResults
    SpendKinds <- LRSpendKinds

    RefundLocktime     = 3
    InvoiceExpiry      = 2
    MinSettleWindow    = 2
    SettleSafetyMargin = 1
    EmptyLockupGrace   = 1
    EChoices           = {2, 4, 6}
    UnilateralDelay    = 3
    RecourseMargin     = 2

    BreakSettleMargin    = FALSE
    BreakRecourseMargin  = FALSE
    BreakEmptyGrace      = FALSE
    ArkadeHonoursFundKey = TRUE
    FundGateOneShot      = TRUE
    AtomicAdmission      = TRUE
    SettleIsIdempotent   = TRUE
    ServerMayCensor      = TRUE

INVARIANTS
    TypeOK
    NoDoubleFund
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    RecourseBeforeDeadline
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed

PROPERTIES
    ForwardOnly
