\* MUTATION CHECK — `settled` RECORDS A BROADCAST AGAIN.
\*
\* One line differs from OnchainReceive.cfg: SettleNeedsConfirmation = FALSE,
\* which puts back what the corridor shipped before #204 —
\*
\*     const result = await onchain.broadcastRaw(...)
\*     return store.transition(row.id, 'claimed', 'settled', { onchain_claim_txid: result.txid })
\*
\* — a terminal state entered on a broadcast.  `settled` is not in
\* NON_TERMINAL, so findRecoverable never revisits the row: a claim that is
\* evicted, replaced, or simply never mined is invisible, and by then the
\* solver has ALREADY funded the Arkade side.
\*
\* EXPECTED RESULT: Invariant NoSilentLoss is violated — a terminal swap with
\* PaidOut true and Collected false.  Collected() no longer counts an
\* unopposed broadcast as collection, which is the other half of the same fix:
\* while it did, this loss was unstateable rather than absent.
\*
\* Liveness is not checked here; TLC stops at the invariant violation.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions: it can report a
\* liveness counterexample whose cycle exists only in the quotient graph.
\* Verified on LightningSend with this exact shape of fairness.  Corridor
\* authors: do not "optimise" this back on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- ORPhases
    Results    <- ORResults
    SpendKinds <- ORSpendKinds

    HtlcLocktime       = 4
    SettleSafetyMargin = 2
    RefundHorizon      = 2
    MinArkFundWindow   = 1
    LockupDeadline     = 1
    MinConfirmations   = 1
    MtpLag             = 1

    BreakDeadlineOrder  = FALSE
    BreakConfirmations  = FALSE
    FundIsIdempotent    = TRUE
    LockupProvablySpent = FALSE
    IndexerNeverLies    = TRUE
    ClaimFeeAffordable  = TRUE
    MempoolExclusive    = TRUE
    SettleNeedsConfirmation = FALSE
    AtomicAdmission     = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane
