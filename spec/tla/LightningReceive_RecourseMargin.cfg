\* MUTATION CHECK — GATE (d), UNILATERAL_RECOURSE_MARGIN, DELETED.  THE #69 WINDOW.
\*
\* Two lines differ from LightningReceive.cfg: BreakRecourseMargin = TRUE and
\* ServerMayCensor = TRUE.  The censor is not decorative: gate (d) is the
\* admission check that the solver's SOLO recourse opens before E, and the
\* solo leaves only decide outcomes the co-signed path cannot reach — with
\* the server up the existing recovery paths dominate and the gate has no
\* teeth to show (the same reason ClientUnilateralClaim guards ~serverUp).
\*
\* What the mutation buys, at the cfg's constants (UnilateralDelay 3,
\* RecourseMargin 2, so the shipped gate refuses unless now + 5 <= E):
\*
\*   - E = 4 PASSES gates (a)-(c) at the fund ticks — (b) 0 + 2 <= 4,
\*     (c) RefundLocktime 3 + SettleSafetyMargin 1 = 4 <= 4 — and is refused
\*     by gate (d) alone (0 + 3 + 2 > 4).  BreakRecourseMargin deletes that
\*     refusal, the row is funded into exactly the window #69 describes.
\*   - The Arkade server then censors.  The solver's co-signed refund leaf
\*     needs the server; the solo leaf matures at fundedAt 1 + 3 = 4, which
\*     is also E.  At clock 4 the trader's solo claim is free money too —
\*     the held HTLC died at E — and the model's safety invariants do not
\*     care that OUR leaf matured on the same tick: reachability is enough.
\*
\* EXPECTED RESULT: Invariant NoNetLoss is violated — conf = {clientClaim}
\* with clock >= E and settled FALSE: the counterparty holds the payout AND
\* kept their HTLC.  NoSilentLoss fires a few states later once the row
\* routes to `stuck`; TLC stops at the safety violation first.
\*
\* The paired LightningReceive_RecourseControl.cfg runs gate (d) INTACT under
\* the same censorship: E = 4 is refused before any money moves and the
\* E = 6 funding's solo refund matures at 4, a full RecourseMargin before E —
\* GREEN.  That pairing is what makes this run a proof about the guard rather
\* than about the constants.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions; this was
\* verified on LightningSend (SwapCore trap T4).  Pay the 4x instead.

\* The model deliberately goes quiescent once every swap is terminal and the
\* clock has reached MaxClock; that is the end of the modelled world, not a
\* stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 6
    Amount     = 1
    MaxExposed = 2
    Phases     <- LRPhases
    Results    <- LRResults
    SpendKinds <- LRSpendKinds

    RefundLocktime     = 3
    InvoiceExpiry      = 2
    MinSettleWindow    = 2
    SettleSafetyMargin = 1
    EmptyLockupGrace   = 1
    EChoices           = {2, 4, 6}
    UnilateralDelay    = 3
    RecourseMargin     = 2

    BreakSettleMargin    = FALSE
    BreakRecourseMargin  = TRUE
    BreakEmptyGrace      = FALSE
    ArkadeHonoursFundKey = TRUE
    FundGateOneShot      = TRUE
    AtomicAdmission      = TRUE
    SettleIsIdempotent   = TRUE
    ServerMayCensor      = TRUE

INVARIANTS
    TypeOK
    NoDoubleFund
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    RecourseBeforeDeadline
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed

\* Liveness is not checked here; TLC stops at the invariant violation, and
\* the ArmHtlc-unfair lasso the censor enables would be a distraction.
