\* Lightning receive corridor — the green model.
\*
\* 2 swaps, 2 workers, clock bounded to 0..6.
\*
\* Only the RELATIVE ORDERING of the deadlines is modelled, because that
\* ordering is all the guards compare:
\*
\*     InvoiceExpiry 2  <  RefundLocktime 3  <  E 4  <  MaxClock 6
\*     EChoices = {2, 4, 6}                  <-- the environment picks E
\*     gate (c) admits E iff RefundLocktime 3 + SettleSafetyMargin 1 <= E
\*     gate (b) admits E iff now + MinSettleWindow 2 <= E
\*     gate (d) admits E iff now + UnilateralDelay 3 + RecourseMargin 2 <= E
\*
\* Consequences, all of them exercised:
\*   - E = 6 clears all four gates, so funding is admissible at clock 0 and 1
\*     (gate (a) closes at InvoiceExpiry 2)
\*   - E = 4 clears gates (a)-(c) and FAILS gate (d) at every admissible clock
\*     (0 + 3 + 2 > 4) — the gate deciding an admission gate (c) accepted is
\*     what makes it independently decisive here, the property gate (b)
\*     lacks (F6 below).  The funded swap (E = 6) then carries a solo
\*     recourse that matures at fundedAt 1 + 3 = 4, two ticks before E.
\*   - E = 2 clears gate (b) at clock 0 and FAILS gate (c) — which is the
\*     whole reason gate (c) exists: it bounds refund_locktime, fixed at
\*     QUOTE time, against an E the backend only reveals at arm time, and
\*     gate (b) bounds E from `now` and therefore cannot imply it
\*   - E = 2 also fails gate (b) from clock 1 — but NOT INDEPENDENTLY: every
\*     E that fails (b) here already fails (c), so gate (b) never decides an
\*     outcome on its own.  That is not an artefact of these constants; it is
\*     true of the shipped code as well, and it is recorded as a finding at
\*     FundGateOpen below.  (The audit's "deleting gate (b) reproduces the
\*     graph EXACTLY" was measured on the pre-gate-(d) model at MaxClock 4.)
\*   - the solver's recourse opens at clock 3 and the HTLC dies at clock 4 or
\*     6 depending on E: SETTLE_SAFETY_MARGIN realised as one or three ticks
\*     of headroom
\*   - the client's co-signed claim leaf has NO timelock, so ClientClaims is
\*     enabled from the instant of funding through the end of the modelled
\*     world; the client's SOLO leaf (ClientUnilateralClaim) exists only
\*     while the server censors, and only from E on — see the module
\*
\* A larger bound would add longer stretches between funding and the deadline
\* and more values of E.  It would NOT add new interleavings of the read /
\* side-effect / compare-and-swap triple, which is where every finding lives —
\* those are all reachable with two workers on one row inside a single
\* frozen tick.

SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions; this was
\* verified on LightningSend (SwapCore trap T4).  Pay the 4x instead.

\* The model deliberately goes quiescent once every swap is terminal and the
\* clock has reached MaxClock; that is the end of the modelled world, not a
\* stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 6
    Amount     = 1
    MaxExposed = 2
    Phases     <- LRPhases
    Results    <- LRResults
    SpendKinds <- LRSpendKinds

    RefundLocktime     = 3
    InvoiceExpiry      = 2
    MinSettleWindow    = 2
    SettleSafetyMargin = 1
    EmptyLockupGrace   = 1
    EChoices           = {2, 4, 6}
    UnilateralDelay    = 3
    RecourseMargin     = 2

    BreakSettleMargin    = FALSE
    BreakRecourseMargin  = FALSE
    BreakEmptyGrace      = FALSE
    ArkadeHonoursFundKey = TRUE
    FundGateOneShot      = TRUE
    AtomicAdmission      = TRUE
    SettleIsIdempotent   = TRUE
    ServerMayCensor      = FALSE

INVARIANTS
    TypeOK
    NoDoubleFund
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    RecourseBeforeDeadline
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed

PROPERTIES
    ForwardOnly
    Liveness
