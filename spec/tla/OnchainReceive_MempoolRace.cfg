\* THE MEMPOOL RACE ON THE RECEIVE LEG — the mutation OnchainSend has and this
\* module never had.
\*
\* `MempoolExclusive` is declared a MUTATION knob (see (A3)) and guards the
\* CLIENT's L1 refund:
\*
\*     /\ (MempoolExclusive => "solverClaim" \notin bcast[s])
\*
\* With it TRUE the client simply cannot broadcast a refund once the solver's
\* claim is in flight, so the race is assumed away.  Every other cfg in this
\* module pins it TRUE, which left the only mutation knob on this corridor
\* unexercised — OnchainSend_MempoolRace.cfg covers the send leg's mirror of
\* exactly this, and the receive leg had no equivalent.
\*
\* FALSE lets the client's refund be relayed and confirmed after the solver's
\* claim has already been broadcast, which is what an opt-in-RBF sequence on
\* the client's own refund input would permit on a real chain.
\*
\* ONE CONSTANT DIFFERS from OnchainReceive.cfg.  PROPERTIES are dropped, as in
\* OnchainSend_MempoolRace.cfg: TLC stops at an invariant violation, so a
\* temporal property listed alongside one it is expected to hit is never
\* reached and only misleads a reader about what was checked.
\*
\* EXPECTED RESULT: Invariant NoNetLoss is violated, and this is the honest
\* residual rather than a regression — the same shape OnchainSend_MempoolRace.cfg
\* records on the send leg.  The client's L1 refund confirms over the solver's
\* already-broadcast claim once the locktime opens, after the Arkade side was
\* taken, so the client collects both legs.
\*
\* The defence is not a state-machine guard: it is the L1 CLAIM WINDOW, and
\* arkade-os/intent-solver#160 is where its width gets decided.  Measured at 29
\* states (1,083,696 generated / 160,264 distinct, depth 29) on this model.
\*
\* This header asserted nothing when the cfg was written, deliberately — the
\* outcome was the question it existed to ask.  It is recorded now because TLC
\* has been run, not because anyone predicted it.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions: it can report a
\* liveness counterexample whose cycle exists only in the quotient graph.
\* Verified on LightningSend with this exact shape of fairness.  Corridor
\* authors: do not "optimise" this back on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- ORPhases
    Results    <- ORResults
    SpendKinds <- ORSpendKinds

    HtlcLocktime       = 4
    SettleSafetyMargin = 2
    RefundHorizon      = 2
    MinArkFundWindow   = 1
    LockupDeadline     = 1
    MinConfirmations   = 1
    MtpLag             = 1

    BreakDeadlineOrder  = FALSE
    BreakConfirmations  = FALSE
    FundIsIdempotent    = TRUE
    LockupProvablySpent = FALSE
    IndexerNeverLies    = TRUE
    ClaimFeeAffordable  = TRUE
    MempoolExclusive    = FALSE
    SettleNeedsConfirmation = TRUE
    AtomicAdmission     = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane
