\* Onchain send corridor — the green model.
\*
\* 2 swaps, 2 workers, wall clock bounded to 0..3 (MaxClock = 3),
\* median-time-past trailing it by up to 1.
\*
\* Only the RELATIVE ORDERING of the deadlines is modelled, because that
\* ordering is all the guards compare.  Scaled from src/core/onchainSend.ts
\* at minConfirmations = 1 (T0 = quote time):
\*
\*     htlc_locktime          T0 + 11400   ->  HtlcLocktime    1
\*     refund armed           T0 + 16800   ->  clock >= 2      (+ margin 1)
\*     funding gate closes    T0 + 20400   ->  clock >= 1
\*     refund_locktime        T0 + 25800   ->  RefundLocktime  3
\*
\*     MtpLag 1 <= RefundMtpMargin 1                <-- the sizing claim (A1)
\*     HtlcLocktime 1 + RefundMtpMargin 1 < RefundLocktime 3  <-- budget > 0
\*
\* Consequences, all of them exercised:
\*   - funding is admissible only at clock 0 (clock + MinFundWindow 2 <
\*     RefundLocktime 3), so a lockup
\*     first seen at clock 1 or 2 reaches `funded` and is then REFUSED —
\*     late funding is never honoured, because both locktimes were anchored
\*     at quote time
\*   - a lockup never seen by clock 3 gives quoted -> refused
\*   - median-time-past is exactly one behind wall clock immediately after
\*     every Tick, so a refund armed at clock 2 becomes final as soon as
\*     median-time-past passes htlc_locktime 1 — STRICTLY, i.e. at
\*     chainTime 2, per BIP113 (see RefundBroadcastable)
\*   - the client may claim the L1 HTLC at ANY clock once the funding output
\*     is 1 deep, including at the same instant the solver arms its refund,
\*     which is what drives refunding_onchain -> claiming
\*   - the client's Arkade refund path opens at clock 3, which is also
\*     MaxClock, leaving ONE tick for the whole refunding_onchain ->
\*     claiming -> claimed recovery.  Tight on purpose: a wider budget only
\*     makes the recovery easier, and every counterexample here is about
\*     ordering rather than about how much time is left
\*
\* A larger bound (MaxClock 6, 3 swaps) would add longer stretches of
\* `awaiting_claim` before a claim or a timeout, and exposure arithmetic over
\* more than two concurrent admissions.  It would NOT add new interleavings
\* of the read / side-effect / compare-and-swap triple, which is where every
\* finding lives — those are all reachable with two workers on one row inside
\* a single frozen tick.

SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions (SwapCore trap
\* T4, verified on LightningSend: symmetry on -> bogus liveness
\* counterexample, symmetry off -> no error).  Do not "optimise" this on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 3
    Amount     = 1
    MaxExposed = 2
    Phases     <- OSPhases
    Results    <- OSResults
    SpendKinds <- OSSpendKinds

    HtlcLocktime     = 1
    RefundMtpMargin  = 1
    MtpLag           = 1
    RefundLocktime   = 3
    MinFundWindow    = 2
    LockupDeadline   = 2
    MinConfirmations = 1
    RefundNeedsConfirmation = TRUE

    BreakRefundRecheck = FALSE
    BreakRefundTiming  = FALSE
    MempoolExclusive   = TRUE
    FundIsIdempotent   = TRUE
    LockupReadIsReliable = TRUE
    AtomicAdmission    = TRUE


\* WHY LIVENESS IS CHECKED IN A SEPARATE CFG.
\*
\* This model has 517,174 distinct states.  TLC's liveness tableau over it is
\* twice that many nodes with the fourteen fairness conditions this spec needs, and
\* it does not converge in a usable time — a 26-minute run was still inside
\* the final "Checking 2 branches of temporal properties" pass when it was
\* abandoned.  That is SwapCore's trap T3 in its slow form rather than its
\* out-of-memory form.
\*
\* So `Liveness` lives in OnchainSend_Liveness.cfg, which is the IDENTICAL
\* model on ONE swap (8,152 distinct states, green in 5 s) and checks every
\* invariant and both action properties as well.  Nothing about liveness on
\* this corridor is cross-row: every stall the fairness conditions exist to
\* rule out is a worker looping on a single row, and both workers are still
\* present in the one-swap model.  What the two-swap model adds — and why it
\* is the one that carries ExposureBounded — is concurrent ADMISSION, which
\* is a safety property.
\*
\* Both cfgs are green and both are shipped.  Do not merge them.

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    ForwardOnly
    L1OutcomeIsFinal
