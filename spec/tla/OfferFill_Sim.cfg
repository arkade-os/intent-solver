\* Simulation only (not swept): three processes, one of them old, more crashes and deferrals.
\*
\* node <tla-model skill>/scripts/tla.mjs sim spec/tla/OfferFill --cfg OfferFill_Sim.cfg --num 20000 --depth 100

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Workers = {w1, w2, w3}
    Legacy = {w3}
    MaxCrashes = 3
    MaxDeferrals = 3
    LegacyRow = TRUE
    Recovery = TRUE
    BreakLatch = FALSE
    BreakRevertGuard = FALSE
    BreakRevertReset = FALSE
    BreakLegacyReverted = FALSE
    LateTyped = FALSE

INVARIANTS
    NoDoubleFill
    LatchedNeverReady
    FilledMeansSent
    TypeOK
