\* MUTATION CHECK — THE DEADLINE ORDERING IS REMOVED.  (THE MANDATED ONE.)
\*
\* ONE line differs from OnchainReceive.cfg:
\*
\*   BreakDeadlineOrder = TRUE    deletes the second term of htlcLocktimeFor
\*                                (core/onchainReceive.ts):
\*
\*     arkadeRefundLocktimeFor(c, now) + MIN_SETTLE_WINDOW
\*                                     ^^^^^^^^^^^^^^^^^^^ gone
\*
\* IT USED TO TAKE TWO, and that is worth recording.  Before #160 the two
\* deadlines were derived independently and R was
\* `min(E - SETTLE_SAFETY_MARGIN, now + MAX_REFUND_HORIZON)`, where the cap
\* always won: the margin term never selected, so deleting it changed nothing
\* and the mutation had to raise the horizon first before it could be felt.
\* The gap was a leftover.  It is now the formula, so the one flag is the
\* whole mutation and its control differs from this file in that line alone.
\*
\* With the mutation E = R = 3: the solver's own escape hatch opens at the
\* exact instant the client's does, with no margin at all, and the covenant
\* CLTV matures against the chain tip, so in practice the client is there
\* first.
\*
\* EXPECTED RESULT: Invariant NoNetLoss is violated — the client claims the
\* Arkade lockup (taking the solver's own float, paid to the client's payout
\* script by the covenant) while the solver's only recourse, the L1 HTLC, has
\* already gone back to the client past htlc_locktime.  The trace is
\* reproduced in the comment block at the end of OnchainReceive.tla.
\*
\* Liveness is not checked here; TLC stops at the invariant violation.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 5
    Amount     = 1
    MaxExposed = 2
    Phases     <- ORPhases
    Results    <- ORResults
    SpendKinds <- ORSpendKinds

    FundingBudget      = 2
    MinSettleWindow    = 2
    SettleSafetyMargin = 1
    MinArkFundWindow   = 1
    LockupDeadline     = 1
    MinConfirmations   = 1
    MtpLag             = 1

    BreakDeadlineOrder  = TRUE
    BreakConfirmations  = FALSE
    FundIsIdempotent    = TRUE
    LockupProvablySpent = FALSE
    IndexerNeverLies    = TRUE
    ClaimFeeAffordable  = TRUE
    MempoolExclusive    = TRUE
    SettleNeedsConfirmation = TRUE
    AtomicAdmission     = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane
