\* MUTATION CHECK — THE DEADLINE ORDERING IS REMOVED.  (THE MANDATED ONE.)
\*
\* Two lines differ from OnchainReceive.cfg:
\*
\*   BreakDeadlineOrder = TRUE    deletes the first bound from
\*                                arkadeRefundLocktimeFor
\*                                (src/core/onchainReceive.ts:106-107):
\*
\*     Math.min(htlcLocktime - SETTLE_SAFETY_MARGIN, now + MAX_REFUND_HORIZON)
\*                ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ gone
\*
\*   RefundHorizon = 4            an operator raises MAX_REFUND_HORIZON
\*
\* THE SECOND LINE IS NOT PADDING, IT IS THE POINT.  Under the shipped
\* constants the horizon (7200 s) is always smaller than
\* htlcLocktime - SETTLE_SAFETY_MARGIN (>= 9900 s), so the margin term never
\* selects and deleting it changes nothing.  The corridor's ordering invariant
\*
\*     R + SETTLE_SAFETY_MARGIN <= E
\*
\* therefore holds today as a SIDE EFFECT of the horizon cap, not because the
\* margin term does any work.  Raising MAX_REFUND_HORIZON is the moment the
\* margin term becomes the only thing standing between the solver and a full
\* loss — and this cfg raises it with the term deleted.  Its control,
\* OnchainReceive_BrokenControl.cfg, raises it and KEEPS the term, and is
\* GREEN: that pair is the proof the guard is load-bearing rather than
\* decorative.
\*
\* With the mutation R = RefundHorizon = 4 = HtlcLocktime: the solver's own
\* escape hatch opens at the exact instant the client's does, with no margin
\* at all, and the covenant CLTV matures against the chain tip, so in practice
\* the client is there first.
\*
\* EXPECTED RESULT: Invariant NoNetLoss is violated — the client claims the
\* Arkade lockup (taking the solver's own float, paid to the client's payout
\* script by the covenant) while the solver's only recourse, the L1 HTLC, has
\* already gone back to the client past htlc_locktime.  The trace is
\* reproduced in the comment block at the end of OnchainReceive.tla.
\*
\* Liveness is not checked here; TLC stops at the invariant violation.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- ORPhases
    Results    <- ORResults
    SpendKinds <- ORSpendKinds

    HtlcLocktime       = 4
    SettleSafetyMargin = 2
    RefundHorizon      = 4
    MinArkFundWindow   = 1
    LockupDeadline     = 1
    MinConfirmations   = 1
    MtpLag             = 1

    BreakDeadlineOrder  = TRUE
    BreakConfirmations  = FALSE
    FundIsIdempotent    = TRUE
    LockupProvablySpent = FALSE
    IndexerNeverLies    = TRUE
    ClaimFeeAffordable  = TRUE
    MempoolExclusive    = TRUE
    SettleNeedsConfirmation = TRUE
    AtomicAdmission     = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane
