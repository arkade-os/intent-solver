\* EXPECTED RESULT: NoDoubleFill violated.
\*
\* OfferFill.cfg with BreakRevertGuard = TRUE: revertUnsubmitted matches on
\* state = 'filling' alone, which is what #331 first shipped. Harmless while the
\* only caller was the attempt's own typed refusal; once recovery reads a row
\* `selecting` and another attempt marks it before the revert lands, the revert
\* clears the latch and the row is filled again.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Workers = {w1, w2}
    Legacy = {}
    MaxCrashes = 1
    MaxDeferrals = 1
    LegacyRow = FALSE
    Recovery = TRUE
    BreakLatch = FALSE
    BreakRevertGuard = TRUE
    BreakRevertReset = FALSE
    BreakLegacyReverted = FALSE
    LateTyped = FALSE

INVARIANTS
    NoDoubleFill
    LatchedNeverReady
    FilledMeansSent
    TypeOK
