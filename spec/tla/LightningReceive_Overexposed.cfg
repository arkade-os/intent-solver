\* MUTATION CHECK — THE EXPOSURE CAP IS A READ-THEN-INSERT.
\*
\* Two lines differ from LightningReceive.cfg: AtomicAdmission = FALSE (today's
\* TypeScript) and MaxExposed = 1 so the cap can bind with two swaps.
\*
\* quote() does `(await store.committedSats()) + amountSats >
\* this.deps.maxExposedSats` at src/receive/orchestrator.ts:217 and then, after
\* an await that yields, `await store.insertQuote(...)` at :257.  There is no
\* transaction and — unlike the duplicate-payment-hash check one line above,
\* which has the partial UNIQUE index as a real backstop — NO DATABASE-LEVEL
\* CONSTRAINT expressing the cap at all.  Two concurrent quotes for different
\* hashes both read the same stale total and both insert.
\*
\* EXPECTED RESULT: Invariant ExposureBounded is violated.
\*
\* CONTROL: the same cfg with AtomicAdmission = TRUE is green, which is what
\* proves the fix (enforce the cap in the same write that consumes it, e.g.
\* INSERT ... SELECT ... WHERE (SELECT SUM(...)) + ? <= ?) sufficient rather
\* than merely plausible.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions; this was
\* verified on LightningSend (SwapCore trap T4).  Pay the 4x instead.

\* The model deliberately goes quiescent once every swap is terminal and the
\* clock has reached MaxClock; that is the end of the modelled world, not a
\* stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 1
    Phases     <- LRPhases
    Results    <- LRResults
    SpendKinds <- LRSpendKinds

    RefundLocktime     = 3
    InvoiceExpiry      = 2
    MinSettleWindow    = 2
    SettleSafetyMargin = 1
    EmptyLockupGrace   = 1
    EChoices           = {2, 4}
    UnilateralDelay    = 1
    RecourseMargin     = 1

    BreakSettleMargin    = FALSE
    BreakRecourseMargin  = FALSE
    BreakEmptyGrace      = FALSE
    ArkadeHonoursFundKey = TRUE
    FundGateOneShot      = TRUE
    AtomicAdmission      = FALSE
    SettleIsIdempotent   = TRUE
    ServerMayCensor      = FALSE

INVARIANTS
    TypeOK
    NoDoubleFund
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    RecourseBeforeDeadline
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
