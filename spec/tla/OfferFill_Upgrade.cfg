\* EXPECTED RESULT: GREEN. the upgrade: a row left `filling` by the old version, and an old process still running.
\*
\* OfferFill.cfg with LegacyRow = TRUE and w2 on the version before fill_phase.
\* The row starts `filling` with no phase, having submitted or not; w2 claims
\* without stamping a phase and submits without marking. Recovery escalates a
\* phase-less `filling` row instead of walking it back, so neither can be filled
\* a second time. That is also why the migration is ADD COLUMN and nothing else.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Workers = {w1, w2}
    Legacy = {w2}
    MaxCrashes = 1
    MaxDeferrals = 1
    LegacyRow = TRUE
    Recovery = TRUE
    BreakLatch = FALSE
    BreakRevertGuard = FALSE
    BreakRevertReset = FALSE
    BreakLegacyReverted = FALSE
    LateTyped = FALSE

INVARIANTS
    NoDoubleFill
    LatchedNeverReady
    FilledMeansSent
    TypeOK

PROPERTIES
    FillingResolves
