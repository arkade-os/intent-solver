\* MUTATION CHECK — THE EXPOSURE CAP GOES BACK TO READ-THEN-INSERT.
\*
\* AtomicAdmission = FALSE makes quote() trust the committedSats() snapshot it
\* read earlier instead of re-checking the cap in the INSERT that consumes it.
\* That is today's TypeScript (src/receive/onchainOrchestrator.ts:201-206):
\* findLiveByPaymentHash, then committedSats, then insertQuote — three awaits
\* with no transaction around them and NO database-level backstop, unlike the
\* duplicate-payment-hash check on the line above, which has the partial
\* UNIQUE index behind it and is therefore genuinely atomic.
\*
\* MaxExposed = 1 so the cap actually binds with two swaps of Amount 1.
\*
\* Note this is already racy in Node — Hono serves HTTP requests concurrently
\* and the event loop interleaves two handlers at the awaits — and gets
\* strictly worse with a Go handler pool.  Note also that the cap is per
\* STORE: the four corridors open four separate SQLite files and each
\* compares its own committedSats() against the same configured limit, so the
\* system-wide ceiling is 4 x MAX_EXPOSED_SATS even with zero concurrency.
\* That second effect is out of this module's scope; it needs a spec that
\* holds all four corridors at once.
\*
\* EXPECTED RESULT: Invariant ExposureBounded is violated — both swaps are
\* admitted and the provider is committed to twice its cap.
\*
\* OnchainReceive_OverexposedControl.cfg is the same model with
\* AtomicAdmission = TRUE and is GREEN, which is the proof that folding the
\* check into the write is a sufficient fix rather than a plausible one.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 1
    Phases     <- ORPhases
    Results    <- ORResults
    SpendKinds <- ORSpendKinds

    HtlcLocktime       = 4
    SettleSafetyMargin = 2
    RefundHorizon      = 2
    MinArkFundWindow   = 1
    LockupDeadline     = 1
    MinConfirmations   = 1
    MtpLag             = 1

    BreakDeadlineOrder  = FALSE
    BreakConfirmations  = FALSE
    FundIsIdempotent    = TRUE
    LockupProvablySpent = FALSE
    IndexerNeverLies    = TRUE
    ClaimFeeAffordable  = TRUE
    MempoolExclusive    = TRUE
    SettleNeedsConfirmation = TRUE
    AtomicAdmission     = FALSE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane
