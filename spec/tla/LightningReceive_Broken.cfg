\* MUTATION CHECK — SETTLE_SAFETY_MARGIN REMOVED.  THE MANDATED ONE.
\*
\* One line differs from LightningReceive.cfg: BreakSettleMargin = TRUE, which
\* deletes gate (c) from evaluateReceiveFunding (src/core/receive.ts:196-198):
\*
\*     if (refundLocktime > htlcExpiresAt - SETTLE_SAFETY_MARGIN)
\*       return { fund: false, reason: 'refund_deadline_too_late' }
\*
\* The solver may now fund the Arkade lockup against a held HTLC whose deadline
\* E lands at or before its OWN refund path opens.  The interval (E,
\* refund_locktime) is pure downside: the inbound payment has failed back and
\* the recourse has not opened, while the client's timelock-free claim leaf is
\* live the whole time.
\*
\* EXPECTED RESULT: Invariant RecourseBeforeDeadline is violated — E passes
\* with the solver's own float sitting in a script it cannot yet refund.
\* LightningReceive_BrokenLoss.cfg runs the SAME mutation against the money
\* invariant alone and shows the outright loss that follows.
\*
\* Liveness is not checked here; TLC stops at the invariant violation.
SPECIFICATION Spec

