\* EVM send corridor - the green model.
\*
\* 2 swaps, 2 workers, wall clock bounded to 0..5, EVM height to 0..4,
\* height advancing inside the cadence band [FastCad, SlowCad] = [1, 2].
\*
\* Only the RELATIVE ORDERING of the deadlines is modelled, because that
\* ordering is all the guards compare.  Scaled from src/core/evmSend.ts
\* (orderMargin 2h, minClaimWindow 30min, T0 = quote time):
\*
\*     evm_timeout (height)   T0 + 30min at the SLOWEST cadence -> EvmTimeoutH 1
\*     refund_locktime (wall) T0 + 30min + 2h                 -> RefundLocktime 4
\*
\*     EvmTimeoutH 1 * SlowCad 2 < RefundLocktime 4   <-- the margin (A2)
\*
\* Consequences, all of them exercised:
\*   - at the slowest cadence the ERC20 refund opens at wall 2, a full 2
\*     ticks before the client's sats refund opens at wall 4, so a solver
\*     that is never claimed always pulls its ERC20 back in time
\*   - the client may claim the ERC20 at ANY height, including after the
\*     timeout height and before the solver's refund lands - the block race
\*     (A4) is decided by interleaving, exactly as the contract decides it
\*   - a quote goes stale at clock 2 (ValidUntil): funding first seen after
\*     that is refused, funding never seen is refused at the locktime
\*
\* EXPECTED RESULT: green.  All assumptions at their safe settings:
\* LockCommitFirst (A1), RefundSeesClaim (A4), TxidPatchAtomic (A5),
\* LockLandsPromptly (A6), TimeoutRefundCoversPresent (A7) TRUE;
\* AtomicAdmission TRUE; BreakDeadlineOrder FALSE.  Every mutation has its
\* own cfg; see the module's MUTATION CHECKS.
\*
\* RESULT: green.  13,556,587 states generated, 1,817,286 distinct, depth
\* 46, 10min 10s (-workers 4).  All nine invariants, ForwardOnly, and
\* Liveness (terminal or crash-parked in claiming/refunding_evm, F1).

SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED (SwapCore trap T4).

\* The model deliberately goes quiescent once every swap is terminal and
\* both clocks have reached their bound; that is the end of the modelled
\* world, not a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 5
    Amount     = 1
    MaxExposed = 2
    Phases     <- ESPhases
    Results    <- ESResults
    SpendKinds <- ESSpendKinds

    EvmTimeoutH    = 1
    RefundLocktime = 4
    ValidUntil     = 2
    MaxHeight      = 4
    FastCad        = 1
    SlowCad        = 2

    LockCommitFirst    = TRUE
    TxidPatchAtomic    = TRUE
    RefundSeesClaim    = TRUE
    LockLandsPromptly  = TRUE
    TimeoutRefundCoversPresent = TRUE
    AtomicAdmission    = TRUE
    BreakDeadlineOrder = FALSE

INVARIANTS
    TypeOK
    NoDoubleLock
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    HeightSane

PROPERTIES
    ForwardOnly
    Liveness
