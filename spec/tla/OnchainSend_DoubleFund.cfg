\* MUTATION CHECK — THE FUNDING BACKEND IS NOT IDEMPOTENT.
\*
\* FundIsIdempotent = FALSE is not a hypothetical: it is production today.
\* src/send/onchainOrchestrator.ts:544-556 states plainly that the funding call
\* — LND's sendToChainAddress — takes no idempotency key, so nothing at the
\* backend deduplicates two calls for one swap.
\*
\* The compare-and-swap does not help.  It gates ENTRY into funding_onchain
\* (funded -> funding_onchain, whose loser returns false); it does not gate
\* OCCUPANCY, and the row sits in funding_onchain for the entire duration of
\* the fund() RPC.  A second worker that reads the row mid-RPC sees exactly
\* the same state and exactly the same preconditions — recoverFunding's chain
\* read finds nothing, because the first payment is not visible yet — and
\* funds again.  The same shape is reachable single-threaded, via a crash
\* between the backend committing and the payment becoming visible.
\*
\* EXPECTED RESULT: Invariant NoDoublePay is violated.  Two real, unrecoverable
\* L1 payments of amountSats to one HTLC address, which the client can drain
\* twice with a single preimage (the claim leaf binds no amount), and only one
\* funding_txid is ever recorded on the row.
\*
\* packages/solver-app/src/worker.ts:20-25 asserts that money-safety does not depend on the
\* in-process `inFlight` Set and rests on the store's compare-and-swap alone.
\* This cfg is that assertion being false.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions (SwapCore trap
\* T4, verified on LightningSend: symmetry on -> bogus liveness
\* counterexample, symmetry off -> no error).  Do not "optimise" this on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 3
    Amount     = 1
    MaxExposed = 2
    Phases     <- OSPhases
    Results    <- OSResults
    SpendKinds <- OSSpendKinds

    HtlcLocktime     = 1
    RefundMtpMargin  = 1
    MtpLag           = 1
    RefundLocktime   = 3
    MinFundWindow    = 2
    LockupDeadline   = 2
    MinConfirmations = 1

    BreakRefundRecheck = FALSE
    BreakRefundTiming  = FALSE
    MempoolExclusive   = TRUE
    FundIsIdempotent   = FALSE
    LockupReadIsReliable = TRUE
    AtomicAdmission    = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    L1OutcomeIsFinal
