\* THE LIVENESS MODEL — the identical spec on ONE swap.
\*
\* Same constants as OnchainSend.cfg in every respect that matters to a
\* single row: same two clocks, same MTP lag, same deadlines, same two
\* workers racing, crashing and losing compare-and-swaps.  Only `Swaps` is
\* smaller, because the two-swap model's 12,900,506 states make TLC's liveness
\* tableau impractical (see the note in OnchainSend.cfg).
\*
\* MaxExposed is 1 rather than 2 purely to keep the cap arithmetic consistent
\* with one swap; the cap is genuinely exercised in OnchainSend_Overexposed.cfg
\* and its control, not here.
\*
\* This cfg checks EVERY invariant, BOTH action properties and Liveness.
\* Green: 227,057 states generated, 37,590 distinct, depth 33, 11 s.

SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions (SwapCore trap
\* T4, verified on LightningSend: symmetry on -> bogus liveness
\* counterexample, symmetry off -> no error).  Do not "optimise" this on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 3
    Amount     = 1
    MaxExposed = 1
    Phases     <- OSPhases
    Results    <- OSResults
    SpendKinds <- OSSpendKinds

    HtlcLocktime     = 1
    RefundMtpMargin  = 1
    MtpLag           = 1
    RefundLocktime   = 3
    MinFundWindow    = 2
    LockupDeadline   = 2
    MinConfirmations = 1
    RefundNeedsConfirmation = TRUE

    BreakRefundRecheck = FALSE
    BreakRefundTiming  = FALSE
    MempoolExclusive   = TRUE
    FundIsIdempotent   = TRUE
    LockupReadIsReliable = TRUE
    AtomicAdmission    = TRUE
    AtomicFundLease    = TRUE
    CrashStrandsLease  = FALSE

    ClientMayUnroll = TRUE
    ExitDelay       = 2
    ClaimsUnrolled  = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedNeverPaid
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    ForwardOnly
    L1OutcomeIsFinal
    Liveness
