\* MUTATION CHECK — whenClaiming BELIEVES AN EMPTY spendableOnly READ.
\*
\* LockupReadIsReliable = FALSE removes the `Spent(s)` precondition from
\* ClaimSeesEmpty, which is what today's TypeScript actually does:
\*
\*   src/send/onchainOrchestrator.ts:645-649
\*     const outputs = await arkade.findLockups(row.pkScript)
\*     if (outputs.length === 0) {
\*       await store.fail(row.id, 'claiming', 'lockup empty while claiming ...')
\*       return false                                   // -> stuck
\*     }
\*
\* and src/arkade/wallet.ts:133-136 shows why the read is not proof:
\*
\*   getVtxos({ scripts: [pkScriptHex], spendableOnly: true })
\*
\* `spendableOnly` answers [] for a vtxo that is lagging, swept or renewed
\* exactly as it does for one that has been spent.  The SAME repository already
\* refuses to make this inference on the refund path — pushRefund
\* (onchainOrchestrator.ts:313-317) throws rather than record an outcome unless
\* `lockupProvablySpent` confirms the spend, and its comment says exactly why.
\* whenClaiming has no such second read.
\*
\* WHY IT COSTS MONEY HERE AND NOT ON THE REFUND PATH.  A row reaches
\* `claiming` only by way of SeeClaim or RefundSeesClaim, i.e. only AFTER the
\* client's L1 claim was seen — the solver's own sats are already gone and P is
\* already on disk.  `stuck` is the one terminal NoSilentLoss tolerates, so
\* nothing pages louder than a parked row; meanwhile refund_locktime keeps
\* running and the client's refundWithoutReceiver leaf opens on the very Arkade
\* lockup that P would have collected.
\*
\* EXPECTED RESULT: Invariant NoNetLoss is violated, ~25 states.  Note what the
\* counterexample does NOT need: no crash, no lost compare-and-swap, no second
\* worker, no adversarial timing.  One lagging indexer read is the whole bug.
\*
\* CONTROL: OnchainSend.cfg is this model with LockupReadIsReliable = TRUE and
\* is green, so the empty-read inference is the sole cause.

SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions (SwapCore trap
\* T4, verified on LightningSend: symmetry on -> bogus liveness
\* counterexample, symmetry off -> no error).  Do not "optimise" this on.

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 3
    Amount     = 1
    MaxExposed = 2
    Phases     <- OSPhases
    Results    <- OSResults
    SpendKinds <- OSSpendKinds

    HtlcLocktime     = 1
    RefundMtpMargin  = 1
    MtpLag           = 1
    RefundLocktime   = 3
    MinFundWindow    = 2
    LockupDeadline   = 2
    MinConfirmations = 1
    RefundNeedsConfirmation = TRUE

    BreakRefundRecheck = FALSE
    BreakRefundTiming  = FALSE
    MempoolExclusive   = TRUE
    FundIsIdempotent   = TRUE
    LockupReadIsReliable = FALSE
    AtomicAdmission    = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    ForwardOnly
    L1OutcomeIsFinal

\* Liveness is checked only in OnchainSend_Liveness.cfg.
