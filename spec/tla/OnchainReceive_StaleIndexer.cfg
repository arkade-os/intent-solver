\* MUTATION CHECK — THE INDEXER'S TWO VIEWS ARE ALLOWED TO SKEW.
\*
\* One line differs from OnchainReceive.cfg: IndexerNeverLies = FALSE, which
\* lets findClaimPreimage return null for a claim that HAS landed.  This is
\* not a fault, it is how the two reads are built (:600-608):
\*
\*   findLockups     is getVtxos({spendableOnly: true}) and empties the
\*                   INSTANT a claim marks the vtxo spent
\*   findClaimPreimage must additionally see spentBy/settledBy populated AND
\*                   fetch the spending virtual transaction back
\*
\* In the gap the pair reads exactly like the inexplicable case — "the lockup
\* is gone and nothing claimed it" — on a swap that in fact COMPLETED.
\* EMPTY_LOCKUP_GRACE (120 s from row.updatedAt) is the only thing standing
\* between that and terminal `stuck`, and it is a heuristic, not a bound:
\* indexer lag is unbounded in principle.  This module abstracts the 120 s to
\* "may not be judged on ONE look", which is exactly what the code's own
\* comment argues for, and the mutation shows what happens when the second
\* look is no better than the first.
\*
\* Why it costs money and not just a page: `stuck` has NO outgoing edge, this
\* leg has no operator retry command, and the swap it discards is one where
\* the CLIENT ALREADY HAS THE SOLVER'S ARKADE FLOAT.  Nobody ever sweeps the
\* L1 HTLC, so at htlc_locktime the client refunds that too.
\*
\* EXPECTED RESULT: Invariant NoNetLoss is violated.
\*
\* The fix this argues for is not a longer grace: it is the read the corridor
\* already owns and does not use here — lockupProvablySpent
\* (src/arkade/wallet.ts:284), used by BOTH send legs and deliberately
\* excluded from OnchainReceiveArkadeOps' Pick list.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- ORPhases
    Results    <- ORResults
    SpendKinds <- ORSpendKinds

    HtlcLocktime       = 4
    SettleSafetyMargin = 2
    RefundHorizon      = 2
    MinArkFundWindow   = 1
    LockupDeadline     = 1
    MinConfirmations   = 1
    MtpLag             = 1

    BreakDeadlineOrder  = FALSE
    BreakConfirmations  = FALSE
    FundIsIdempotent    = TRUE
    LockupProvablySpent = FALSE
    IndexerNeverLies    = FALSE
    ClaimFeeAffordable  = TRUE
    MempoolExclusive    = TRUE
    AtomicAdmission     = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane
