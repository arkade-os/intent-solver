\* MUTATION CHECK — THE EXPOSURE CAP IS A READ-THEN-INSERT.
\*
\* AtomicAdmission = FALSE makes quote() trust the committedSats() snapshot it
\* read several awaits earlier, which is today's TypeScript
\* (src/send/onchainOrchestrator.ts:175-177 then :220).  MaxExposed = 1 makes
\* the cap bind with two swaps.
\*
\* Unlike the duplicate-payment-hash check on the line above it — which has
\* the partial UNIQUE index (src/db/onchainSwaps.ts:193-194) as a genuine
\* database-level backstop — the aggregate cap has NOTHING behind it: no
\* transaction, no constraint, no CAS.  Two concurrent quote handlers both
\* read capacity and both insert.
\*
\* EXPECTED RESULT: Invariant ExposureBounded is violated.
\*
\* CONTROL: the same cfg with AtomicAdmission = TRUE is green, which is what
\* makes this a proof that folding the cap into the write is SUFFICIENT and
\* not merely plausible.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions (SwapCore trap
\* T4, verified on LightningSend: symmetry on -> bogus liveness
\* counterexample, symmetry off -> no error).  Do not "optimise" this on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 3
    Amount     = 1
    MaxExposed = 1
    Phases     <- OSPhases
    Results    <- OSResults
    SpendKinds <- OSSpendKinds

    HtlcLocktime     = 1
    RefundMtpMargin  = 1
    MtpLag           = 1
    RefundLocktime   = 3
    MinFundWindow    = 2
    LockupDeadline   = 2
    MinConfirmations = 1
    RefundNeedsConfirmation = TRUE

    BreakRefundRecheck = FALSE
    BreakRefundTiming  = FALSE
    MempoolExclusive   = TRUE
    FundIsIdempotent   = TRUE
    LockupReadIsReliable = TRUE
    AtomicAdmission    = FALSE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    L1OutcomeIsFinal
