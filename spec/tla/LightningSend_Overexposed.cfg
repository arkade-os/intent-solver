\* MUTATION CHECK — THE EXPOSURE CAP GOES BACK TO READ-THEN-INSERT.
\*
\* AtomicAdmission = FALSE makes quote() trust the committedSats() snapshot it
\* read earlier instead of re-checking the cap in the INSERT that consumes it.
\* That is today's TypeScript (src/send/orchestrator.ts:248-250): a plain
\* read, an await, then an unconditional insert, with NO database-level
\* backstop — unlike the duplicate-payment-hash check one line above, which
\* has the partial UNIQUE index behind it.
\*
\* MaxExposed = 1 so the cap actually binds with two swaps of Amount 1.
\*
\* EXPECTED RESULT: Invariant ExposureBounded is violated — both swaps are
\* admitted and the provider is committed to twice its cap.
\*
\* The same model with AtomicAdmission = TRUE is GREEN, which is the proof
\* that folding the check into the write is a sufficient fix.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions: with
\* `SYMMETRY Perms` this exact model reports a liveness counterexample whose
\* cycle leaves a payment in flight forever while WF(ResolvePayment(s1)) says
\* it must resolve.  The cycle exists only in the quotient graph.  Verified by
\* running the same model with symmetry off, where TLC reports no error.
\* Corridor authors: do not "optimise" this back on.

\* The model deliberately goes quiescent once every swap is terminal and the
\* clock has reached MaxClock; that is the end of the modelled world, not a
\* stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 1
    Phases     <- LSPhases
    Results    <- LSResults
    SpendKinds <- LSSpendKinds

    RefundLocktime   = 3
    MinClaimWindow   = 2
    MinInvoiceWindow = 1
    InvoiceExpiry    = 4
    LockupDeadline   = 3
    HtlcMaxLifetime  = 1

    BreakClaimWindow          = FALSE
    BackendHonoursIdempotency = TRUE
    AtomicAdmission           = FALSE
    IndexerNeverLies          = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
