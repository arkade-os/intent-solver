\* CALIBRATION CHECK — THE MTP MARGIN REMOVED.  EXPECTED TO STAY GREEN.
\*
\* BreakRefundTiming = TRUE drops the whole arming condition from
\* whenAwaitingClaim (src/send/onchainOrchestrator.ts:620-622):
\*
\*     if (this.now() >= row.htlcLocktime + HTLC_REFUND_MTP_MARGIN) {
\*       return store.transition(row.id, 'awaiting_claim', 'refunding_onchain', {})
\*     }
\*
\* so the solver may arm and try to broadcast its refund at any instant.
\*
\* THIS ONE IS SHIPPED BECAUSE IT DOES *NOT* PRODUCE A COUNTEREXAMPLE, and
\* that is a finding rather than a hole.  HTLC_REFUND_MTP_MARGIN is not a
\* solver-money guard.  Its two stated purposes are (1) not broadcasting a
\* transaction consensus rejects as non-final, which the model enforces
\* independently at BroadcastRefund via chainTime >= HtlcLocktime — a rejected
\* broadcast throws, the row stays in refunding_onchain, and the next tick's
\* re-read recovers it; and (2) not widening the window in which a
\* late-but-valid client claim collides with a refund the solver has committed
\* to — which costs the CLIENT their swap and costs the solver nothing,
\* because the back-edge hands it P either way.
\*
\* So the margin buys transaction validity and client experience, not solver
\* money.  Removing it is caught by neither NoSilentLoss nor NoNetLoss, and
\* the invariants are RIGHT not to fire.  What actually protects the solver
\* here is the pre-broadcast re-read (OnchainSend_Broken.cfg) and the
\* terminality of `refunded` (OnchainSend_MempoolRace.cfg).
\*
\* Run with the properties on, so a liveness stall would still be caught.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions (SwapCore trap
\* T4, verified on LightningSend: symmetry on -> bogus liveness
\* counterexample, symmetry off -> no error).  Do not "optimise" this on.

\* The model deliberately goes quiescent once every swap is terminal and both
\* clocks have reached their bound; that is the end of the modelled world, not
\* a stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 3
    Amount     = 1
    MaxExposed = 2
    Phases     <- OSPhases
    Results    <- OSResults
    SpendKinds <- OSSpendKinds

    HtlcLocktime     = 1
    RefundMtpMargin  = 1
    MtpLag           = 1
    RefundLocktime   = 3
    MinFundWindow    = 2
    LockupDeadline   = 2
    MinConfirmations = 1

    BreakRefundRecheck = FALSE
    BreakRefundTiming  = TRUE
    MempoolExclusive   = TRUE
    FundIsIdempotent   = TRUE
    LockupReadIsReliable = TRUE
    AtomicAdmission    = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    ForwardOnly
    L1OutcomeIsFinal

\* Liveness is checked only in OnchainSend.cfg (the full green run); these two
\* controls check every invariant plus both action properties, which is what
\* they exist to answer, and skip the expensive temporal tableau.
