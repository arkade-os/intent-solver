\* Lightning send corridor — the green model.
\*
\* 2 swaps, 2 workers, clock bounded to 0..5.
\*
\* Only the RELATIVE ORDERING of the deadlines is modelled, because that
\* ordering is all the guards compare:
\*
\*     MinClaimWindow 2  >  HtlcMaxLifetime 1     <-- the design constraint (A1)
\*     RefundLocktime 3  =  LockupDeadline 3  <  InvoiceExpiry 4 = MaxClock 4
\*
\* Consequences, all of them exercised:
\*   - paying is legal while clock <= 1  (clock + MinClaimWindow <= 3)
\*   - an inflight payment must resolve within one tick, so by clock 2 < 3
\*   - the client's covenant refund path opens at clock 3
\*   - a lockup first seen at clock 2 is `funded` but already past the pay
\*     gate, so funded -> refused is reachable: late funding is refused,
\*     never paid, because refund_locktime was anchored at quote time
\*   - a lockup never seen by clock 3 gives quoted -> refused
\*
\* The same model with MaxClock 5 / RefundLocktime 4 / LockupDeadline 4 /
\* InvoiceExpiry 5 was also run to completion and is green (230,102 distinct
\* states, 7m48s).  It widens the pay window from two ticks to three and adds
\* nothing else.  A larger bound still (MaxClock 12, 3 swaps) would add longer
\* stretches of `inflight` before resolution and exposure arithmetic over more
\* than two concurrent admissions.  It would NOT add new interleavings of the
\* read / side-effect / compare-and-swap triple, which is where every finding
\* lives — those are all reachable with two workers on one row inside a single
\* frozen tick.

SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions: with
\* `SYMMETRY Perms` this exact model reports a liveness counterexample whose
\* cycle leaves a payment in flight forever while WF(ResolvePayment(s1)) says
\* it must resolve.  The cycle exists only in the quotient graph.  Verified by
\* running the same model with symmetry off, where TLC reports no error.
\* Corridor authors: do not "optimise" this back on.

\* The model deliberately goes quiescent once every swap is terminal and the
\* clock has reached MaxClock; that is the end of the modelled world, not a
\* stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- LSPhases
    Results    <- LSResults
    SpendKinds <- LSSpendKinds

    RefundLocktime   = 3
    MinClaimWindow   = 2
    MinInvoiceWindow = 1
    InvoiceExpiry    = 4
    LockupDeadline   = 3
    HtlcMaxLifetime  = 1

    BreakClaimWindow          = FALSE
    BackendHonoursIdempotency = TRUE
    AtomicAdmission           = TRUE
    IndexerNeverLies          = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed

PROPERTIES
    ForwardOnly
    Liveness
