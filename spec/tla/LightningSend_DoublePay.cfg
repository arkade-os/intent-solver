\* MUTATION CHECK — THE LIGHTNING BACKEND STOPS BEING AUTHORITATIVE PER KEY.
\*
\* BackendHonoursIdempotency = FALSE.  Nothing in the DATABASE changes: the
\* compare-and-swap on funded -> paying still admits exactly one winner.  What
\* changes is that ln.payInvoice no longer collapses two calls carrying the
\* same derived key `swap-${payment_hash}` into one payment.
\*
\* This is the R2 race from the code review, and it is the direct answer to
\* the question the Go rewrite is asking.  whenPaying's recovery branch
\* (src/send/orchestrator.ts:535-541) is guarded only by `!row.paymentId`,
\* which two workers can read simultaneously; today the in-process `inFlight`
\* Set hides it, and a Go rewrite deletes that Set.
\*
\* EXPECTED RESULT: Invariant NoDoublePay is violated — two Lightning
\* payments against one Arkade lockup.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions: with
\* `SYMMETRY Perms` this exact model reports a liveness counterexample whose
\* cycle leaves a payment in flight forever while WF(ResolvePayment(s1)) says
\* it must resolve.  The cycle exists only in the quotient graph.  Verified by
\* running the same model with symmetry off, where TLC reports no error.
\* Corridor authors: do not "optimise" this back on.

\* The model deliberately goes quiescent once every swap is terminal and the
\* clock has reached MaxClock; that is the end of the modelled world, not a
\* stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- LSPhases
    Results    <- LSResults
    SpendKinds <- LSSpendKinds

    RefundLocktime   = 3
    MinClaimWindow   = 2
    MinInvoiceWindow = 1
    InvoiceExpiry    = 4
    LockupDeadline   = 3
    HtlcMaxLifetime  = 1

    BreakClaimWindow          = FALSE
    BackendHonoursIdempotency = FALSE
    AtomicAdmission           = TRUE
    IndexerNeverLies          = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
