\* MUTATION CHECK — OnchainSend.cfg with ClaimsUnrolled = FALSE.  EXPECTED RESULT: Invariant NoNetLoss is violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 3
    Amount     = 1
    MaxExposed = 2
    Phases     <- OSPhases
    Results    <- OSResults
    SpendKinds <- OSSpendKinds

    HtlcLocktime     = 1
    RefundMtpMargin  = 1
    MtpLag           = 1
    RefundLocktime   = 3
    MinFundWindow    = 2
    LockupDeadline   = 2
    MinConfirmations = 1
    RefundNeedsConfirmation = TRUE

    BreakRefundRecheck = FALSE
    BreakRefundTiming  = FALSE
    MempoolExclusive   = TRUE
    FundIsIdempotent   = TRUE
    LockupReadIsReliable = TRUE
    AtomicAdmission    = TRUE
    AtomicFundLease    = TRUE
    CrashStrandsLease  = TRUE
    PreCommitFunding   = TRUE
    LeaseTtl           = TRUE
    RecordIsCas        = TRUE
    RefuseNeedsNoTx    = TRUE

    ClientMayUnroll = TRUE
    ExitDelay       = 2
    ClaimsUnrolled  = FALSE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedNeverPaid
    StuckReachableFromEveryExposed
    ChainTimeSane
