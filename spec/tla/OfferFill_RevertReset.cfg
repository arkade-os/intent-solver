\* EXPECTED RESULT: NoDoubleFill violated.
\*
\* OfferFill_Upgrade.cfg (an old process, w2, still running) with
\* BreakRevertReset = TRUE: a walk-back leaves fill_phase = 'selecting' instead
\* of clearing it. The old process then claims the row without touching the
\* phase and submits without marking; a sweep reads 'selecting', takes it for an
\* attempt that never sent, walks it back, and the row is filled twice.

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Workers = {w1, w2}
    Legacy = {w2}
    MaxCrashes = 1
    MaxDeferrals = 1
    LegacyRow = FALSE
    Recovery = TRUE
    BreakLatch = FALSE
    BreakRevertGuard = FALSE
    BreakRevertReset = TRUE
    BreakLegacyReverted = FALSE
    LateTyped = FALSE

INVARIANTS
    NoDoubleFill
    LatchedNeverReady
    FilledMeansSent
    TypeOK
