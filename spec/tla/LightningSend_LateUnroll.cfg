\* MUTATION CHECK — LightningSend.cfg with ClaimsUnrolled = FALSE: no L1 claim of an
\* unrolled lockup.  EXPECTED RESULT: Invariant NoNetLoss is violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- LSPhases
    Results    <- LSResults
    SpendKinds <- LSSpendKinds

    RefundLocktime   = 3
    MinClaimWindow   = 2
    MinInvoiceWindow = 1
    InvoiceExpiry    = 4
    LockupDeadline   = 3
    HtlcMaxLifetime  = 1

    BreakClaimWindow          = FALSE
    BackendHonoursIdempotency = TRUE
    AtomicAdmission           = TRUE
    IndexerNeverLies          = TRUE

    ClientMayUnroll = TRUE
    ExitDelay       = 2
    ClaimsUnrolled  = FALSE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedNeverPaid
    StuckReachableFromEveryExposed
