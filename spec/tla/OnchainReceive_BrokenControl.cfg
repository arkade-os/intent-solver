\* CONTROL FOR THE MANDATED MUTATION — MIN_SETTLE_WINDOW PUT BACK.
\*
\* Identical to OnchainReceive_Broken.cfg except for ONE constant:
\*
\*     BreakDeadlineOrder = FALSE
\*
\* so E = R + MinSettleWindow = 3 + 2 = 5 rather than E = R = 3.
\*
\* EXPECTED RESULT: GREEN.  This is the half of the mutation check that makes
\* it worth anything: it proves the counterexample in
\* OnchainReceive_Broken.cfg is caused by the DELETED TERM and by nothing
\* else, and it proves the term is sufficient rather than merely plausible.
\*
\* Since #160 that isolation is exact rather than argued — the cfg diff IS
\* the one flag, where the pair previously also had to move the horizon. The
\* file is kept rather than folded into the green model so the pairing stays
\* legible next to the other mutation checks.
\*
\* It also shows what the term buys in model ticks: the solver's escape hatch
\* opens two ticks before the client's, which is the whole budget for the
\* claimed -> settled sweep after a late Arkade claim.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 5
    Amount     = 1
    MaxExposed = 2
    Phases     <- ORPhases
    Results    <- ORResults
    SpendKinds <- ORSpendKinds

    FundingBudget      = 2
    MinSettleWindow    = 2
    SettleSafetyMargin = 1
    MinArkFundWindow   = 1
    LockupDeadline     = 1
    MinConfirmations   = 1
    MtpLag             = 1

    BreakDeadlineOrder  = FALSE
    BreakConfirmations  = FALSE
    FundIsIdempotent    = TRUE
    LockupProvablySpent = FALSE
    IndexerNeverLies    = TRUE
    ClaimFeeAffordable  = TRUE
    MempoolExclusive    = TRUE
    SettleNeedsConfirmation = TRUE
    AtomicAdmission     = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    ForwardOnly
    Liveness
