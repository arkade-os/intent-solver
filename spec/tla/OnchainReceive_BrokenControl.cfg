\* CONTROL FOR THE MANDATED MUTATION — SETTLE_SAFETY_MARGIN PUT BACK.
\*
\* Identical to OnchainReceive_Broken.cfg except for ONE constant:
\*
\*     BreakDeadlineOrder = FALSE
\*
\* MAX_REFUND_HORIZON stays raised (RefundHorizon = 4), so the horizon cap no
\* longer binds and the `htlcLocktime - SETTLE_SAFETY_MARGIN` term is the one
\* that selects:  R = min(4 - 2, 4) = 2 < 4 = E.
\*
\* EXPECTED RESULT: GREEN.  This is the half of the mutation check that makes
\* it worth anything: it proves the counterexample in
\* OnchainReceive_Broken.cfg is caused by the DELETED GUARD and not by the
\* raised horizon that had to accompany it, and it proves the guard is
\* sufficient — not merely plausible — once the horizon stops masking it.
\*
\* It also shows what the margin buys in model ticks: with R = 3 the solver's
\* escape hatch opens two ticks before the client's, which is the whole
\* budget for the claimed -> settled sweep after a late Arkade claim.
SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- ORPhases
    Results    <- ORResults
    SpendKinds <- ORSpendKinds

    HtlcLocktime       = 4
    SettleSafetyMargin = 2
    RefundHorizon      = 4
    MinArkFundWindow   = 1
    LockupDeadline     = 1
    MinConfirmations   = 1
    MtpLag             = 1

    BreakDeadlineOrder  = FALSE
    BreakConfirmations  = FALSE
    FundIsIdempotent    = TRUE
    LockupProvablySpent = FALSE
    IndexerNeverLies    = TRUE
    ClaimFeeAffordable  = TRUE
    MempoolExclusive    = TRUE
    SettleNeedsConfirmation = TRUE
    AtomicAdmission     = TRUE

INVARIANTS
    TypeOK
    NoDoublePay
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    ChainTimeSane

PROPERTIES
    ForwardOnly
    Liveness
