\* EVM send corridor, ARTIFACT: strict terminality - the parked states
\* named.  Identical constants to the green cfg, but the property is
\* LivenessStrict: every swap must reach a TERMINAL state, no parking.
\*
\* EXPECTED RESULT: LivenessStrict violated.  A crash in the claim or
\* refund push leaves the row in claiming/refunding_evm forever - the
\* shipped planner never re-drives either (the F1 finding), so only the
\* money invariants bound what the parking costs.  The green cfg's
\* Liveness is the statement that holds.

\* RESULT: fires as expected.  7,899,080 states generated, 1,140,412 distinct, 2min 08s (-workers 4).

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 5
    Amount     = 1
    MaxExposed = 2
    Phases     <- ESPhases
    Results    <- ESResults
    SpendKinds <- ESSpendKinds

    EvmTimeoutH    = 1
    RefundLocktime = 4
    ValidUntil     = 2
    MaxHeight      = 4
    FastCad        = 1
    SlowCad        = 2

    LockCommitFirst    = TRUE
    TxidPatchAtomic    = TRUE
    RefundSeesClaim    = TRUE
    LockLandsPromptly  = TRUE
    TimeoutRefundCoversPresent = TRUE
    AtomicAdmission    = TRUE
    BreakDeadlineOrder = FALSE

INVARIANTS
    TypeOK
    NoDoubleLock
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
    HeightSane

PROPERTIES
    LivenessStrict
