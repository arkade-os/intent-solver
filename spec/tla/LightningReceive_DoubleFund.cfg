\* MUTATION CHECK — arkade.fund() IS NOT IDEMPOTENT PER SWAP.
\*
\* One line differs from LightningReceive.cfg: ArkadeHonoursFundKey = FALSE,
\* which is TODAY'S TYPESCRIPT.  src/receive/fundLockup.ts calls
\* wallet.sendBitcoin with no key of any kind, and the compare-and-swap that
\* records the funding runs AFTER the money has moved
\* (src/receive/orchestrator.ts:381 then :391).  The only thing serialising two
\* callers is the in-process `inFlight` Set at orchestrator.ts:291 — which a Go
\* rewrite with N goroutines deletes, and which the Cloudflare queue fan-out
\* already bypasses today.
\*
\* Two workers whose `alreadyFunded` snapshots both read empty both call
\* fund().  The CAS then decides only which of the two broadcasts gets its
\* outpoint RECORDED; the second output is invisible to the row forever, and
\* the covenant claim leaf sweeps WHOLE vtxos, so the client takes one and the
\* other is stranded.
\*
\* EXPECTED RESULT: Invariant NoDoubleFund is violated — the solver paid
\* amountSats twice out of its own float for one swap.
SPECIFICATION Spec

\* SYMMETRY IS DELIBERATELY NOT USED, even though `Perms` is defined and the
\* swap and worker ids really are interchangeable.  TLC's symmetry reduction
\* is unsound in the presence of per-swap fairness conditions; this was
\* verified on LightningSend (SwapCore trap T4).  Pay the 4x instead.

\* The model deliberately goes quiescent once every swap is terminal and the
\* clock has reached MaxClock; that is the end of the modelled world, not a
\* stuck system.  Liveness is what checks for real stalls.
CHECK_DEADLOCK FALSE

CONSTANTS
    Swaps   = {s1, s2}
    Workers = {w1, w2}
    NoSwap  = NoSwap
    NoState = NoState
    MaxClock   = 4
    Amount     = 1
    MaxExposed = 2
    Phases     <- LRPhases
    Results    <- LRResults
    SpendKinds <- LRSpendKinds

    RefundLocktime     = 3
    InvoiceExpiry      = 2
    MinSettleWindow    = 2
    SettleSafetyMargin = 1
    EmptyLockupGrace   = 1
    EChoices           = {2, 4}
    UnilateralDelay    = 1
    RecourseMargin     = 1

    BreakSettleMargin    = FALSE
    BreakRecourseMargin  = FALSE
    BreakEmptyGrace      = FALSE
    ArkadeHonoursFundKey = FALSE
    FundGateOneShot      = TRUE
    AtomicAdmission      = TRUE
    SettleIsIdempotent   = TRUE
    ServerMayCensor      = FALSE

INVARIANTS
    TypeOK
    NoDoubleFund
    AtMostOneOutcome
    ExposureBounded
    NoSilentLoss
    RecourseBeforeDeadline
    NoNetLoss
    RefusedUnreachableFromExposed
    StuckReachableFromEveryExposed
